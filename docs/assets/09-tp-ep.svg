<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760">
  <defs><marker id="b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker></defs>
  <style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#6b7280}.panel{font-size:24px;font-weight:700;text-anchor:middle}.h{font-size:18px;font-weight:700;text-anchor:middle}.t{font-size:15px;text-anchor:middle}.line{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#b)}</style>
  <rect width="1400" height="760" fill="#fff"/><text x="55" y="58" class="title">TP 与 EP 都省本地权重，但通信位置不同</text><text x="55" y="92" class="sub">TP 合并同一矩阵的部分结果；EP 先分发 token，再合并不同 Expert 的输出。</text>
  <rect x="55" y="135" width="610" height="545" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><rect x="735" y="135" width="610" height="545" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="360" y="182" class="panel">Tensor Parallel</text><text x="1040" y="182" class="panel">Expert Parallel</text>
  <rect x="105" y="235" width="170" height="90" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="190" y="273" class="h">同一层输入</text><text x="190" y="303" class="t">同一批 token</text><path d="M275 280 H345 V235 H405" class="line"/><path d="M275 280 H345 V410 H405" class="line"/>
  <rect x="405" y="205" width="210" height="100" rx="13" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="510" y="245" class="h">GPU 0</text><text x="510" y="278" class="t">矩阵分片 A</text><rect x="405" y="380" width="210" height="100" rx="13" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="510" y="420" class="h">GPU 1</text><text x="510" y="453" class="t">矩阵分片 B</text><path d="M510 305 V340 H600 V540 H510" class="line"/><path d="M510 480 V540" class="line"/><rect x="280" y="540" width="230" height="85" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="395" y="575" class="h">Collective</text><text x="395" y="605" class="t">合并同一层输出</text>
  <rect x="785" y="235" width="170" height="90" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="870" y="273" class="h">Router Top-K</text><text x="870" y="303" class="t">不同 Expert ID</text><path d="M955 280 H1015 V235 H1075" class="line"/><path d="M955 280 H1015 V410 H1075" class="line"/>
  <rect x="1075" y="205" width="220" height="100" rx="13" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="1185" y="245" class="h">GPU 0</text><text x="1185" y="278" class="t">一组 Experts</text><rect x="1075" y="380" width="220" height="100" rx="13" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="1185" y="420" class="h">GPU 1</text><text x="1185" y="453" class="t">另一组 Experts</text><path d="M1185 305 V340 H1280 V540 H1190" class="line"/><path d="M1185 480 V540" class="line"/><rect x="940" y="540" width="250" height="85" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="1065" y="575" class="h">Dispatch / Combine</text><text x="1065" y="605" class="t">结果回到原 token</text>
  <text x="700" y="720" class="sub" text-anchor="middle">具体 Collective 由 runtime 决定；判断性能必须结合 Batch 和实际互联。</text>
</svg>
