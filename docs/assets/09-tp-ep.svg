<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="tp-ep-title tp-ep-desc">
  <title id="tp-ep-title">TP 切矩阵，EP 分 Expert</title>
  <desc id="tp-ep-desc">TP 让同一批 token 在多个矩阵分片上计算，再用集合通信合并部分结果。EP 按 Router 选出的 Expert ID 分发 token，专家计算后再把结果送回原 token 位置。</desc>
  <defs>
    <marker id="tp-ep-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
  </defs>
  <style>
    text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei','Microsoft JhengHei','SimHei',sans-serif;fill:#111827}
    .title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#6b7280}.panel{font-size:22px;font-weight:700;text-anchor:middle}.heading{font-size:16px;font-weight:700;text-anchor:middle}.note{font-size:14px;fill:#4b5563;text-anchor:middle}.edge{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#tp-ep-arrow)}
  </style>
  <rect width="1200" height="740" fill="#fff" data-graph-role="canvas"/>
  <g data-graph-role="title-block">
    <text x="48" y="56" class="title">TP 切矩阵，EP 分 Expert</text>
    <text x="48" y="88" class="sub">TP 每卡保存一块矩阵；EP 每卡保存一组 Experts。两者的通信发生在不同位置。</text>
  </g>

  <g data-graph-role="container" aria-label="Tensor Parallel">
    <rect x="48" y="126" width="520" height="526" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" data-graph-role="decoration"/>
    <text x="308" y="170" class="panel">Tensor Parallel</text>
    <rect x="208" y="204" width="200" height="68" rx="11" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="308" y="232" class="heading">同一层输入</text><text x="308" y="256" class="note">同一批 token</text>
    <path d="M270 272 V304 H185 V334" class="edge" data-graph-role="edge"/>
    <path d="M346 272 V304 H431 V334" class="edge" data-graph-role="edge"/>
    <rect x="88" y="334" width="194" height="88" rx="11" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="185" y="369" class="heading">GPU 0</text><text x="185" y="399" class="note">矩阵分片 A</text>
    <rect x="334" y="334" width="194" height="88" rx="11" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="431" y="369" class="heading">GPU 1</text><text x="431" y="399" class="note">矩阵分片 B</text>
    <path d="M185 422 V456 H270 V494" class="edge" data-graph-role="edge"/>
    <path d="M431 422 V456 H346 V494" class="edge" data-graph-role="edge"/>
    <rect x="178" y="494" width="260" height="88" rx="11" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="308" y="529" class="heading">集合通信</text><text x="308" y="559" class="note">合并同一层的部分结果</text>
  </g>

  <g data-graph-role="container" aria-label="Expert Parallel">
    <rect x="632" y="126" width="520" height="526" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" data-graph-role="decoration"/>
    <text x="892" y="170" class="panel">Expert Parallel</text>
    <rect x="792" y="204" width="200" height="68" rx="11" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="892" y="232" class="heading">Router Top-K</text><text x="892" y="256" class="note">得到不同 Expert ID</text>
    <path d="M854 272 V304 H769 V334" class="edge" data-graph-role="edge"/>
    <path d="M930 272 V304 H1015 V334" class="edge" data-graph-role="edge"/>
    <rect x="672" y="334" width="194" height="88" rx="11" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="769" y="369" class="heading">GPU 0</text><text x="769" y="399" class="note">一组 Experts</text>
    <rect x="918" y="334" width="194" height="88" rx="11" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="1015" y="369" class="heading">GPU 1</text><text x="1015" y="399" class="note">另一组 Experts</text>
    <path d="M769 422 V456 H854 V494" class="edge" data-graph-role="edge"/>
    <path d="M1015 422 V456 H930 V494" class="edge" data-graph-role="edge"/>
    <rect x="762" y="494" width="260" height="88" rx="11" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="892" y="529" class="heading">Dispatch / Combine</text><text x="892" y="559" class="note">结果回到原 token 位置</text>
  </g>

  <text x="600" y="704" class="sub" text-anchor="middle" data-graph-role="annotation">具体集合通信由 runtime 决定；测试时要记录 Batch 大小和 GPU 互联。</text>
</svg>
