<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Token ID 怎样查 Embedding 表</title>
  <desc id="desc">Token ID 作为行号从 Embedding 参数表中取出对应向量，不是把整数直接送入 Decoder。</desc>
  <style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827}.title{font-size:18px;font-weight:600}.label{font-size:14px;font-weight:600}.sub{font-size:12px;fill:#6b7280}.num{font-family:Menlo,Monaco,monospace;font-size:13px}</style>
  <defs><marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker></defs>
  <rect width="960" height="380" fill="#ffffff"/>
  <text x="40" y="42" class="title">Embedding 用 Token ID 取对应的一行</text>
  <text x="40" y="67" class="sub">当前对象仍是“优化”，已核实 ID 为 99945；向量数值是教学示意。</text>
  <rect x="48" y="142" width="148" height="82" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="122" y="171" text-anchor="middle" class="label">输入 Token ID</text><text x="122" y="202" text-anchor="middle" class="num">99945</text>
  <path d="M216 183H304" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="260" y="167" text-anchor="middle" class="sub">按编号定位</text>
  <text x="330" y="116" class="label">Embedding 参数表中的可见行</text>
  <rect x="330" y="132" width="392" height="48" fill="#ffffff" stroke="#d1d5db"/><rect x="330" y="180" width="392" height="60" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="330" y="240" width="392" height="48" fill="#ffffff" stroke="#d1d5db"/>
  <text x="352" y="162" class="num">111892   推理     [0.2, 0.1, -0.4]</text>
  <text x="352" y="216" class="num">99945    优化     [0.8, -0.2, 0.5]</text>
  <text x="352" y="270" class="num">...      其他 token 的行</text>
  <path d="M742 210H798" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="816" y="164" width="112" height="92" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="872" y="193" text-anchor="middle" class="label">初始向量</text><text x="872" y="222" text-anchor="middle" class="num">[0.8, -0.2, 0.5]</text>
  <text x="40" y="337" class="sub">编号只决定取哪一行。它本身不参与大小比较，也不表示语义强弱。</text>
</svg>
