<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
    .title { font-size: 22px; font-weight: 600; }
    .label { font-size: 15px; font-weight: 600; }
    .sub { font-size: 13px; fill: #6b7280; }
    .num { font-size: 16px; font-weight: 600; }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker></defs>
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="40" y="42" class="title">Linear：用 I 行权重做 I 次点积</text>
  <text x="40" y="68" class="sub">x:[H] 与 W:[I,H] 的每一行分别做点积，得到 y:[I]</text>

  <g transform="translate(50,145)">
    <text x="70" y="-24" text-anchor="middle" class="label">输入 x [H=2]</text>
    <rect x="0" y="0" width="70" height="60" fill="#eff6ff" stroke="#60a5fa"/><rect x="70" y="0" width="70" height="60" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="35" y="37" text-anchor="middle" class="num">1</text><text x="105" y="37" text-anchor="middle" class="num">2</text>
  </g>

  <path d="M210 175 H300" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(320,110)">
    <text x="70" y="-18" text-anchor="middle" class="label">权重 W [I=3,H=2]</text>
    <g stroke="#86efac" fill="#f0fdf4">
      <rect x="0" y="0" width="70" height="60"/><rect x="70" y="0" width="70" height="60"/>
      <rect x="0" y="60" width="70" height="60"/><rect x="70" y="60" width="70" height="60"/>
      <rect x="0" y="120" width="70" height="60"/><rect x="70" y="120" width="70" height="60"/>
    </g>
    <text x="35" y="37" text-anchor="middle" class="num">1</text><text x="105" y="37" text-anchor="middle" class="num">0</text>
    <text x="35" y="97" text-anchor="middle" class="num">0</text><text x="105" y="97" text-anchor="middle" class="num">1</text>
    <text x="35" y="157" text-anchor="middle" class="num">1</text><text x="105" y="157" text-anchor="middle" class="num">1</text>
  </g>

  <path d="M485 200 H575" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(590,105)">
    <rect width="190" height="190" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="95" y="30" text-anchor="middle" class="label">三次点积</text>
    <text x="20" y="68" class="sub">1×1 + 2×0 = 1</text>
    <text x="20" y="108" class="sub">1×0 + 2×1 = 2</text>
    <text x="20" y="148" class="sub">1×1 + 2×1 = 3</text>
  </g>
  <path d="M800 200 H850" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(865,130)">
    <text x="25" y="-18" text-anchor="middle" class="label">y [I]</text>
    <rect width="50" height="50" fill="#faf5ff" stroke="#c084fc"/><rect y="50" width="50" height="50" fill="#faf5ff" stroke="#c084fc"/><rect y="100" width="50" height="50" fill="#faf5ff" stroke="#c084fc"/>
    <text x="25" y="32" text-anchor="middle" class="num">1</text><text x="25" y="82" text-anchor="middle" class="num">2</text><text x="25" y="132" text-anchor="middle" class="num">3</text>
  </g>
  <text x="480" y="382" text-anchor="middle" class="label">y = xWᵀ　　代码：y = x @ W.T</text>
  <text x="480" y="407" text-anchor="middle" class="sub">@ 是矩阵乘法；* 是逐元素乘法</text>
</svg>
