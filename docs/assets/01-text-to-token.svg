<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360">
  <style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827}.title{font-size:18px;font-weight:600}.label{font-size:14px;font-weight:600}.sub{font-size:12px;fill:#6b7280}.mono{font-family:Menlo,Monaco,monospace;font-size:13px}</style>
  <defs><marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker></defs>
  <rect width="960" height="360" fill="#ffffff"/>
  <text x="40" y="42" class="title">Chat Template 把对话补成模型输入</text>
  <text x="40" y="67" class="sub">贯穿案例：用户发来“推理优化”</text>
  <rect x="48" y="116" width="210" height="132" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="72" y="149" class="label">接口中的消息</text>
  <text x="72" y="181" class="mono">role: user</text>
  <text x="72" y="208" class="mono">content: 推理优化</text>
  <path d="M278 182H380" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="329" y="166" text-anchor="middle" class="sub">应用模板</text>
  <rect x="400" y="96" width="500" height="180" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="426" y="128" class="label">格式化后的提示文本（简化示意）</text>
  <rect x="422" y="147" width="126" height="28" rx="5" fill="#dbeafe"/>
  <text x="432" y="166" class="mono">&lt;|im_start|&gt;</text>
  <text x="558" y="166" class="mono">user</text>
  <text x="426" y="202" class="mono">推理优化</text>
  <rect x="510" y="182" width="112" height="28" rx="5" fill="#dbeafe"/>
  <text x="520" y="201" class="mono">&lt;|im_end|&gt;</text>
  <rect x="422" y="221" width="126" height="28" rx="5" fill="#dbeafe"/>
  <text x="432" y="240" class="mono">&lt;|im_start|&gt;</text>
  <text x="558" y="240" class="mono">assistant</text>
  <text x="40" y="322" class="sub">蓝色标记是 Chat Template 补入的消息边界和 assistant 生成起点。</text>
</svg>
