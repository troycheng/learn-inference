<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="title desc">
  <title id="title">SwiGLU 的三条投影怎样连接</title>
  <desc id="desc">输入同时进入 gate_proj 和 up_proj，门控分支经过 SiLU 后与候选特征逐元素相乘，再由 down_proj 回到隐藏维度。</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
    .title { font-size: 22px; font-weight: 600; }
    .label { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; fill: #6b7280; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 13px; }
  </style>
  <defs><marker id="blue-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="40" y="42" class="title">一个 token 怎样穿过 SwiGLU</text>
  <text x="40" y="68" class="sub">此图与第 8 节共用 y_norm=[1,2]、三组权重和每一个中间向量。省略 bias。</text>

  <!-- Arrows are behind cards. -->
  <path d="M188 316 H228 V190 H270" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <path d="M188 316 H228 V452 H270" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <path d="M490 190 H530" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <path d="M710 190 H755 V278" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <path d="M490 452 H755 V350" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <path d="M815 314 H850" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <path d="M1030 314 H1060" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>

  <g transform="translate(55,270)">
    <rect width="133" height="92" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="66" y="30" text-anchor="middle" class="label">归一化后的输入</text>
    <text x="66" y="58" text-anchor="middle" class="mono">y_norm = [1, 2]</text>
    <text x="66" y="79" text-anchor="middle" class="sub">shape=[H]=[2]</text>
  </g>
  <g transform="translate(270,112)">
    <rect width="220" height="156" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5"/>
    <text x="110" y="29" text-anchor="middle" class="label">gate_proj：H → I</text>
    <text x="110" y="55" text-anchor="middle" class="mono">W_gate = [[1,0],[0,1],[1,1]]</text>
    <text x="110" y="83" text-anchor="middle" class="mono">[1,2] → [1,2,3]</text>
    <text x="110" y="112" text-anchor="middle" class="sub">三个点积，shape=[I]=[3]</text>
    <text x="110" y="136" text-anchor="middle" class="sub">gate = [1,2,3]</text>
  </g>
  <g transform="translate(530,112)">
    <rect width="180" height="156" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="90" y="32" text-anchor="middle" class="label">SiLU(gate)</text>
    <text x="90" y="66" text-anchor="middle" class="mono">[1,2,3]</text>
    <text x="90" y="90" text-anchor="middle" class="sub">↓</text>
    <text x="90" y="118" text-anchor="middle" class="mono">[0.731,1.762,2.858]</text>
    <text x="90" y="142" text-anchor="middle" class="sub">连续的门控值</text>
  </g>
  <g transform="translate(270,374)">
    <rect width="220" height="156" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="110" y="29" text-anchor="middle" class="label">up_proj：H → I</text>
    <text x="110" y="55" text-anchor="middle" class="mono">W_up = [[1,1],[1,-1],[0,1]]</text>
    <text x="110" y="83" text-anchor="middle" class="mono">[1,2] → [3,-1,2]</text>
    <text x="110" y="112" text-anchor="middle" class="sub">三个点积，shape=[I]=[3]</text>
    <text x="110" y="136" text-anchor="middle" class="sub">up = [3,-1,2]</text>
  </g>
  <g transform="translate(755,274)">
    <circle cx="30" cy="40" r="30" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="30" y="47" text-anchor="middle" style="font-size:30px;font-weight:600">⊙</text>
    <text x="30" y="94" text-anchor="middle" class="sub">逐元素相乘</text>
  </g>
  <g transform="translate(850,246)">
    <rect width="180" height="136" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="90" y="31" text-anchor="middle" class="label">中间向量 m</text>
    <text x="90" y="60" text-anchor="middle" class="mono">[0.731,1.762,2.858]</text>
    <text x="90" y="84" text-anchor="middle" class="mono">⊙ [3,-1,2]</text>
    <text x="90" y="113" text-anchor="middle" class="mono">= [2.193,-1.762,5.716]</text>
  </g>
  <g transform="translate(1060,212)">
    <rect width="115" height="204" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="57" y="29" text-anchor="middle" class="label">down_proj</text>
    <text x="57" y="51" text-anchor="middle" class="sub">I → H</text>
    <text x="57" y="82" text-anchor="middle" class="mono">W_down</text>
    <text x="57" y="104" text-anchor="middle" class="mono">[[1,0,0],</text>
    <text x="57" y="124" text-anchor="middle" class="mono"> [0,.5,.5]]</text>
    <text x="57" y="153" text-anchor="middle" class="sub">输出 f</text>
    <text x="57" y="178" text-anchor="middle" class="mono">[2.193,1.977]</text>
  </g>
  <rect x="180" y="568" width="840" height="48" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="600" y="598" text-anchor="middle" class="label">B、T 不变。只有当前 token 的特征宽度从 H=2 变为 I=3，再回到 H=2。</text>
</svg>
