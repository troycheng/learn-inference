<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
    .title { font-size: 22px; font-weight: 600; }
    .label { font-size: 15px; font-weight: 600; }
    .sub { font-size: 13px; fill: #6b7280; }
  </style>
  <defs><marker id="blue-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker></defs>
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="40" y="42" class="title">SwiGLU：两条 H→I 分支逐元素相乘，再 I→H</text>
  <text x="40" y="68" class="sub">门控不是单独的开关，而是一组与中间特征一一对应的调节系数</text>
  <g transform="translate(55,215)"><rect width="125" height="80" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="62" y="31" text-anchor="middle" class="label">输入 x</text><text x="62" y="57" text-anchor="middle" class="sub">[B,T,H]</text></g>
  <path d="M180 255 H235 V150 H280" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <path d="M180 255 H235 V360 H280" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <g transform="translate(290,105)"><rect width="170" height="90" rx="10" fill="#faf5ff" stroke="#c084fc"/><text x="85" y="32" text-anchor="middle" class="label">门控投影</text><text x="85" y="56" text-anchor="middle" class="sub">gate_proj</text><text x="85" y="77" text-anchor="middle" class="sub">H → I</text></g>
  <path d="M460 150 H520" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <g transform="translate(530,105)"><rect width="150" height="90" rx="10" fill="#fff7ed" stroke="#fdba74"/><text x="75" y="34" text-anchor="middle" class="label">SiLU</text><text x="75" y="61" text-anchor="middle" class="sub">连续调节系数</text></g>
  <g transform="translate(290,315)"><rect width="170" height="90" rx="10" fill="#f0fdf4" stroke="#86efac"/><text x="85" y="32" text-anchor="middle" class="label">扩展投影</text><text x="85" y="56" text-anchor="middle" class="sub">up_proj</text><text x="85" y="77" text-anchor="middle" class="sub">H → I</text></g>
  <path d="M680 150 H735 V225" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <path d="M460 360 H735 V305" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <g transform="translate(690,235)"><circle cx="45" cy="30" r="30" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="45" y="36" text-anchor="middle" class="label">×</text><text x="45" y="84" text-anchor="middle" class="sub">逐元素相乘</text></g>
  <path d="M765 265 H805" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <g transform="translate(815,220)"><rect width="145" height="90" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="72" y="30" text-anchor="middle" class="label">回收投影</text><text x="72" y="54" text-anchor="middle" class="sub">down_proj</text><text x="72" y="76" text-anchor="middle" class="sub">I → H</text></g>
  <text x="500" y="470" text-anchor="middle" class="label">down_proj( SiLU(gate_proj(x)) ⊙ up_proj(x) )</text>
  <text x="500" y="497" text-anchor="middle" class="sub">B、T 始终不变；只有每个 token 的特征宽度 H → I → H</text>
</svg>
