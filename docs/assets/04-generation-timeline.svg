<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">一次请求中的 Prefill 和 Decode</title>
  <desc id="desc">四个 Prompt token 在 Prefill 中一起处理并生成 y1，随后每轮 Decode 输入上一个已生成 token，依次生成 y2 和 y3，同时缓存长度逐步增长。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .title { font-size: 31px; font-weight: 700; }
      .head { font-size: 22px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 600; }
      .note { font-size: 16px; fill: #6B7280; }
      .stage { fill: #FFFFFF; stroke: #D1D5DB; stroke-width: 2; }
      .prompt { fill: #DBEAFE; stroke: #93C5FD; stroke-width: 1.5; }
      .output { fill: #FED7AA; stroke: #FDBA74; stroke-width: 1.5; }
      .cache { fill: #DCFCE7; stroke: #86EFAC; stroke-width: 1.5; }
      .flow { fill: none; stroke: #2563EB; stroke-width: 3; marker-end: url(#arrow-blue); }
    </style>
  </defs>
  <rect width="1200" height="650" fill="#FFFFFF"/>
  <text x="55" y="58" class="title">一次生成要经过多次模型前向</text>
  <text x="55" y="94" class="note">每次前向只处理已经确定的 token。橙色 token 要到下一轮才会写入 Cache。</text>

  <rect x="45" y="130" width="330" height="410" rx="18" class="stage"/>
  <text x="210" y="171" text-anchor="middle" class="head">Prefill</text>
  <text x="210" y="203" text-anchor="middle" class="note">4 个 Prompt token 已全部知道</text>
  <g transform="translate(72 237)">
    <rect x="0" y="0" width="58" height="58" rx="9" class="prompt"/><text x="29" y="37" text-anchor="middle" class="label">p1</text>
    <rect x="68" y="0" width="58" height="58" rx="9" class="prompt"/><text x="97" y="37" text-anchor="middle" class="label">p2</text>
    <rect x="136" y="0" width="58" height="58" rx="9" class="prompt"/><text x="165" y="37" text-anchor="middle" class="label">p3</text>
    <rect x="204" y="0" width="58" height="58" rx="9" class="prompt"/><text x="233" y="37" text-anchor="middle" class="label">p4</text>
  </g>
  <rect x="95" y="330" width="230" height="58" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="210" y="366" text-anchor="middle" class="label">一次模型前向</text>
  <path d="M210 295V325" class="flow"/>
  <rect x="88" y="428" width="145" height="52" rx="9" class="cache"/><text x="160" y="460" text-anchor="middle" class="label">Cache：p1 至 p4</text>
  <rect x="253" y="428" width="72" height="52" rx="9" class="output"/><text x="289" y="461" text-anchor="middle" class="label">y1</text>
  <path d="M210 388V416H160V423" class="flow"/>
  <path d="M210 388V416H289V423" class="flow"/>

  <rect x="435" y="130" width="330" height="410" rx="18" class="stage"/>
  <text x="600" y="171" text-anchor="middle" class="head">Decode 第 1 轮</text>
  <text x="600" y="203" text-anchor="middle" class="note">只输入刚刚选出的 y1</text>
  <rect x="564" y="237" width="72" height="58" rx="9" class="output"/><text x="600" y="274" text-anchor="middle" class="label">y1</text>
  <rect x="485" y="330" width="230" height="58" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="600" y="354" text-anchor="middle" class="label">读取历史 Cache</text>
  <text x="600" y="377" text-anchor="middle" class="note">只计算新位置</text>
  <path d="M600 295V325" class="flow"/>
  <rect x="478" y="428" width="145" height="52" rx="9" class="cache"/><text x="550" y="460" text-anchor="middle" class="label">Cache：再加 y1</text>
  <rect x="643" y="428" width="72" height="52" rx="9" class="output"/><text x="679" y="461" text-anchor="middle" class="label">y2</text>
  <path d="M600 388V416H550V423" class="flow"/>
  <path d="M600 388V416H679V423" class="flow"/>

  <rect x="825" y="130" width="330" height="410" rx="18" class="stage"/>
  <text x="990" y="171" text-anchor="middle" class="head">Decode 第 2 轮</text>
  <text x="990" y="203" text-anchor="middle" class="note">y2 确定后才能开始</text>
  <rect x="954" y="237" width="72" height="58" rx="9" class="output"/><text x="990" y="274" text-anchor="middle" class="label">y2</text>
  <rect x="875" y="330" width="230" height="58" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="990" y="354" text-anchor="middle" class="label">读取历史 Cache</text>
  <text x="990" y="377" text-anchor="middle" class="note">只计算新位置</text>
  <path d="M990 295V325" class="flow"/>
  <rect x="868" y="428" width="145" height="52" rx="9" class="cache"/><text x="940" y="460" text-anchor="middle" class="label">Cache：再加 y2</text>
  <rect x="1033" y="428" width="72" height="52" rx="9" class="output"/><text x="1069" y="461" text-anchor="middle" class="label">y3</text>
  <path d="M990 388V416H940V423" class="flow"/>
  <path d="M990 388V416H1069V423" class="flow"/>

  <path d="M325 454H418V266H559" class="flow"/>
  <path d="M715 454H808V266H949" class="flow"/>
  <rect x="55" y="574" width="1090" height="48" rx="10" fill="#F8FAFC" stroke="#D1D5DB"/>
  <text x="600" y="605" text-anchor="middle" class="label">y1 被选出时还不在 Cache；输入下一轮后才会写入</text>
</svg>
