<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360">
  <style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827}.title{font-size:18px;font-weight:600}.label{font-size:14px;font-weight:600}.sub{font-size:12px;fill:#6b7280}.num{font-family:Menlo,Monaco,monospace;font-size:13px}</style>
  <defs><marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker></defs>
  <rect width="960" height="360" fill="#ffffff"/>
  <text x="40" y="42" class="title">Decoder 让最后位置的向量结合上下文</text>
  <text x="40" y="67" class="sub">只画两个内容 token 和最后一个模板位置，其他模板位置省略；4096 维向量缩成 2 维教学数值。</text>
  <text x="54" y="116" class="label">初始 Embeddings</text>
  <rect x="48" y="132" width="138" height="72" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><rect x="202" y="132" width="138" height="72" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><rect x="356" y="132" width="178" height="72" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="117" y="160" text-anchor="middle" class="label">推理</text><text x="117" y="187" text-anchor="middle" class="num">[0.2, 0.1]</text>
  <text x="271" y="160" text-anchor="middle" class="label">优化</text><text x="271" y="187" text-anchor="middle" class="num">[0.8, -0.2]</text>
  <text x="445" y="160" text-anchor="middle" class="label">最后一个模板位置</text><text x="445" y="187" text-anchor="middle" class="sub">assistant 生成起点</text>
  <path d="M554 168H614" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="636" y="112" width="142" height="112" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="707" y="151" text-anchor="middle" class="label">32 层 Decoder</text><text x="707" y="178" text-anchor="middle" class="sub">每个位置读取可见前文</text><text x="707" y="201" text-anchor="middle" class="sub">并反复更新表示</text>
  <path d="M798 168H826" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="838" y="122" width="98" height="92" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="887" y="151" text-anchor="middle" class="label">最后位置 h</text><text x="887" y="183" text-anchor="middle" class="num">[1, 2]</text>
  <text x="40" y="294" class="sub">“优化”的 Embedding 只来自它自己的 ID。生成时使用完整模板最后位置的 Hidden State，它已经结合此前位置。</text>
</svg>
