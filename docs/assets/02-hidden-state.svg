<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
  <title id="title">Hidden State 的行和列</title>
  <desc id="desc">每一行对应一个 token 位置的向量，每一列对应模型学习到的一个特征方向。</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
    .title { font-size: 22px; font-weight: 600; }
    .label { font-size: 15px; font-weight: 600; }
    .sub { font-size: 13px; fill: #6b7280; }
    .num { font-size: 15px; }
  </style>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="40" y="42" class="title">Hidden State：行是 token，列是特征坐标</text>
  <text x="40" y="68" class="sub">示例忽略批次轴：T=3，H=4</text>
  <g transform="translate(250,125)">
    <text x="220" y="-35" text-anchor="middle" class="label">H = 4 个特征坐标</text>
    <text x="55" y="-10" text-anchor="middle" class="sub">h0</text><text x="165" y="-10" text-anchor="middle" class="sub">h1</text><text x="275" y="-10" text-anchor="middle" class="sub">h2</text><text x="385" y="-10" text-anchor="middle" class="sub">h3</text>
    <g stroke="#93c5fd">
      <rect x="0" y="0" width="110" height="70" fill="#eff6ff"/><rect x="110" y="0" width="110" height="70" fill="#eff6ff"/><rect x="220" y="0" width="110" height="70" fill="#eff6ff"/><rect x="330" y="0" width="110" height="70" fill="#eff6ff"/>
      <rect x="0" y="70" width="110" height="70" fill="#f0fdf4"/><rect x="110" y="70" width="110" height="70" fill="#f0fdf4"/><rect x="220" y="70" width="110" height="70" fill="#f0fdf4"/><rect x="330" y="70" width="110" height="70" fill="#f0fdf4"/>
      <rect x="0" y="140" width="110" height="70" fill="#fff7ed"/><rect x="110" y="140" width="110" height="70" fill="#fff7ed"/><rect x="220" y="140" width="110" height="70" fill="#fff7ed"/><rect x="330" y="140" width="110" height="70" fill="#fff7ed"/>
    </g>
    <text x="55" y="43" text-anchor="middle" class="num">0.2</text><text x="165" y="43" text-anchor="middle" class="num">-0.7</text><text x="275" y="43" text-anchor="middle" class="num">1.1</text><text x="385" y="43" text-anchor="middle" class="num">0.3</text>
    <text x="55" y="113" text-anchor="middle" class="num">0.5</text><text x="165" y="113" text-anchor="middle" class="num">0.4</text><text x="275" y="113" text-anchor="middle" class="num">-0.2</text><text x="385" y="113" text-anchor="middle" class="num">0.8</text>
    <text x="55" y="183" text-anchor="middle" class="num">-0.1</text><text x="165" y="183" text-anchor="middle" class="num">0.9</text><text x="275" y="183" text-anchor="middle" class="num">0.6</text><text x="385" y="183" text-anchor="middle" class="num">-0.5</text>
  </g>
  <text x="210" y="169" text-anchor="end" class="label">token 0</text><text x="210" y="239" text-anchor="end" class="label">token 1</text><text x="210" y="309" text-anchor="end" class="label">token 2</text>
  <path d="M690 155 H850" stroke="#2563eb" stroke-width="3"/>
  <text x="770" y="140" text-anchor="middle" class="sub">一行：一个 token 的完整向量</text>
  <path d="M525 360 V430" stroke="#16a34a" stroke-width="3"/>
  <text x="545" y="398" class="sub">一列：同一特征坐标</text>
  <text x="480" y="458" text-anchor="middle" class="label">完整语义通常由许多坐标共同表示，不给每一列强行贴人工标签</text>
</svg>
