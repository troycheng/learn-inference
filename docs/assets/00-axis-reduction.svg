<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
    .title { font-size: 22px; font-weight: 600; }
    .label { font-size: 15px; font-weight: 600; }
    .sub { font-size: 13px; fill: #6b7280; }
    .num { font-size: 18px; font-weight: 600; }
  </style>
  <defs>
    <marker id="blue-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="40" y="42" class="title">归约：被指定的轴消失</text>
  <text x="40" y="68" class="sub">同一个 [2,3] 矩阵，选择不同轴会保留不同数量的结果</text>

  <g transform="translate(70,130)">
    <text x="90" y="-25" text-anchor="middle" class="label">X，shape = [2,3]</text>
    <g fill="#eff6ff" stroke="#93c5fd">
      <rect x="0" y="0" width="60" height="60"/><rect x="60" y="0" width="60" height="60"/><rect x="120" y="0" width="60" height="60"/>
      <rect x="0" y="60" width="60" height="60"/><rect x="60" y="60" width="60" height="60"/><rect x="120" y="60" width="60" height="60"/>
    </g>
    <text x="30" y="38" text-anchor="middle" class="num">1</text><text x="90" y="38" text-anchor="middle" class="num">2</text><text x="150" y="38" text-anchor="middle" class="num">3</text>
    <text x="30" y="98" text-anchor="middle" class="num">4</text><text x="90" y="98" text-anchor="middle" class="num">5</text><text x="150" y="98" text-anchor="middle" class="num">6</text>
  </g>

  <path d="M270 175 H400" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <text x="335" y="155" text-anchor="middle" class="label">axis=0</text>
  <text x="335" y="198" text-anchor="middle" class="sub">合并两行</text>
  <g transform="translate(425,140)">
    <text x="105" y="-18" text-anchor="middle" class="label">输出 shape = [3]</text>
    <g fill="#eff6ff" stroke="#60a5fa">
      <rect x="0" y="0" width="70" height="70"/><rect x="70" y="0" width="70" height="70"/><rect x="140" y="0" width="70" height="70"/>
    </g>
    <text x="35" y="43" text-anchor="middle" class="num">5</text><text x="105" y="43" text-anchor="middle" class="num">7</text><text x="175" y="43" text-anchor="middle" class="num">9</text>
    <text x="105" y="100" text-anchor="middle" class="sub">[1+4, 2+5, 3+6]</text>
  </g>

  <path d="M160 250 V365 H500" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#green-arrow)"/>
  <text x="184" y="318" class="label">axis=1：合并每行的三列</text>
  <g transform="translate(520,330)">
    <text x="70" y="-20" text-anchor="middle" class="label">输出 shape = [2]</text>
    <g fill="#f0fdf4" stroke="#4ade80">
      <rect x="0" y="0" width="70" height="70"/><rect x="70" y="0" width="70" height="70"/>
    </g>
    <text x="35" y="43" text-anchor="middle" class="num">6</text><text x="105" y="43" text-anchor="middle" class="num">15</text>
    <text x="70" y="100" text-anchor="middle" class="sub">[1+2+3, 4+5+6]</text>
  </g>
  <text x="480" y="456" text-anchor="middle" class="sub">一维输出怎样横着显示只是排版；应根据保留下来的轴理解它</text>
</svg>
