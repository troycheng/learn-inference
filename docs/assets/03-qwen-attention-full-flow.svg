<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3.5-9B 多头 Attention 子层的完整计算流程</title>
  <desc id="desc">输入隐藏状态经过 RMSNorm 和 Q、K、V 投影。Q、K 做按头归一化和 RoPE，随后各查询头计算缩放点积、因果遮罩、Softmax 和 V 的加权汇总。十六个头的输出拼接后乘输出门控，经过输出投影，再与原输入残差相加。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .title { font-size: 31px; font-weight: 700; }
      .head { font-size: 21px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 600; }
      .note { font-size: 16px; fill: #64748B; }
      .input { fill: #EFF6FF; stroke: #2563EB; stroke-width: 2; }
      .process { fill: #FFF7ED; stroke: #EA580C; stroke-width: 2; }
      .value { fill: #F0FDF4; stroke: #16A34A; stroke-width: 2; }
      .gate { fill: #FAF5FF; stroke: #7C3AED; stroke-width: 2; }
      .group { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 2; }
      .blue-line { fill: none; stroke: #2563EB; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .gray-line { fill: none; stroke: #64748B; stroke-width: 2.5; marker-end: url(#arrow-gray); }
      .purple-line { fill: none; stroke: #7C3AED; stroke-width: 2.5; marker-end: url(#arrow-purple); }
    </style>
  </defs>

  <rect width="1200" height="1180" fill="#FFFFFF"/>
  <text x="54" y="58" class="title">Qwen3.5-9B：从输入 X 到 Attention 子层输出</text>
  <text x="54" y="92" class="note">蓝色是 Attention 主计算，紫色是输出门控，灰色是保留原输入的残差路径。</text>

  <!-- section backgrounds -->
  <rect x="54" y="302" width="1092" height="140" rx="14" class="group"/>
  <text x="78" y="330" class="head">三组投影</text>
  <rect x="54" y="463" width="1092" height="110" rx="14" class="group"/>
  <text x="78" y="491" class="head">按头整理</text>
  <rect x="54" y="600" width="1092" height="150" rx="14" class="group"/>
  <text x="78" y="628" class="head">单头计算</text>
  <text x="78" y="732" class="note">GQA 映射：h1～h4 使用 g1，h5～h8 使用 g2，依此类推</text>

  <!-- connectors -->
  <path d="M600 178 V216" class="blue-line"/>
  <path d="M510 279 V302 H250 V330" class="blue-line"/>
  <path d="M600 279 V330" class="blue-line"/>
  <path d="M690 279 V302 H950 V330" class="blue-line"/>
  <path d="M250 420 V493" class="blue-line"/>
  <path d="M600 420 V493" class="blue-line"/>
  <path d="M950 420 V493" class="blue-line"/>
  <path d="M250 551 V590 H350 V626" class="blue-line"/>
  <path d="M600 551 V580 H385 V626" class="blue-line"/>
  <path d="M950 551 V590 H810 V626" class="blue-line"/>
  <path d="M410 666 H490" class="blue-line"/>
  <path d="M650 666 H730" class="blue-line"/>
  <path d="M890 666 H955" class="blue-line"/>
  <path d="M1050 710 V766 H600 V802" class="blue-line"/>
  <path d="M600 880 V919" class="blue-line"/>
  <path d="M600 997 V1021" class="blue-line"/>
  <path d="M735 1056 H770" class="blue-line"/>
  <path d="M830 1056 H860" class="blue-line"/>

  <path d="M130 390 H116 V958 H465" class="purple-line"/>
  <path d="M690 137 H1110 V1056 H830" class="gray-line"/>

  <!-- nodes -->
  <rect x="510" y="110" width="180" height="68" rx="10" class="input"/>
  <text x="600" y="138" text-anchor="middle" class="head">输入 X</text>
  <text x="600" y="163" text-anchor="middle" class="note">[B,T,4096]</text>

  <rect x="510" y="216" width="180" height="63" rx="10" class="input"/>
  <text x="600" y="254" text-anchor="middle" class="head">RMSNorm</text>

  <rect x="130" y="330" width="240" height="90" rx="10" class="input"/>
  <text x="250" y="362" text-anchor="middle" class="label">q_proj → 拆成 Q 和 Gate</text>
  <text x="250" y="390" text-anchor="middle" class="note">Q [B,16,T,256]</text>
  <text x="250" y="412" text-anchor="middle" class="note">Gate [B,T,4096]</text>
  <rect x="480" y="330" width="240" height="90" rx="10" class="input"/>
  <text x="600" y="365" text-anchor="middle" class="label">k_proj</text>
  <text x="600" y="395" text-anchor="middle" class="note">K [B,4,T,256]</text>
  <rect x="830" y="330" width="240" height="90" rx="10" class="input"/>
  <text x="950" y="365" text-anchor="middle" class="label">v_proj</text>
  <text x="950" y="395" text-anchor="middle" class="note">V [B,4,T,256]</text>

  <rect x="130" y="493" width="240" height="58" rx="10" class="process"/>
  <text x="250" y="518" text-anchor="middle" class="label">Q：按头 RMSNorm + RoPE</text>
  <text x="250" y="541" text-anchor="middle" class="note">16 个查询头</text>
  <rect x="480" y="493" width="240" height="58" rx="10" class="process"/>
  <text x="600" y="518" text-anchor="middle" class="label">K：按头 RMSNorm + RoPE</text>
  <text x="600" y="541" text-anchor="middle" class="note">4 个 K 头</text>
  <rect x="830" y="493" width="240" height="58" rx="10" class="value"/>
  <text x="950" y="518" text-anchor="middle" class="label">V：调整为按头 shape</text>
  <text x="950" y="541" text-anchor="middle" class="note">V 不做 RoPE</text>

  <rect x="130" y="626" width="280" height="80" rx="10" class="process"/>
  <text x="270" y="651" text-anchor="middle" class="label">① 计算分数</text>
  <text x="270" y="677" text-anchor="middle" class="note">Q(h) · K(g)ᵀ / √256 + M</text>
  <text x="270" y="698" text-anchor="middle" class="note">Score [B,16,T,T]</text>
  <rect x="490" y="626" width="160" height="80" rx="10" class="process"/>
  <text x="570" y="655" text-anchor="middle" class="label">② Softmax</text>
  <text x="570" y="684" text-anchor="middle" class="note">每行变成权重</text>
  <rect x="730" y="626" width="160" height="80" rx="10" class="value"/>
  <text x="810" y="655" text-anchor="middle" class="label">③ 权重 × V(g)</text>
  <text x="810" y="684" text-anchor="middle" class="note">每头汇总 V</text>
  <rect x="955" y="626" width="190" height="84" rx="10" class="value"/>
  <text x="1050" y="656" text-anchor="middle" class="label">④ 各查询头输出</text>
  <text x="1050" y="684" text-anchor="middle" class="note">[B,16,T,256]</text>

  <rect x="465" y="802" width="270" height="78" rx="11" class="value"/>
  <text x="600" y="831" text-anchor="middle" class="head">调整轴顺序并 Concat</text>
  <text x="600" y="859" text-anchor="middle" class="note">[B,T,16×256] = [B,T,4096]</text>

  <rect x="465" y="919" width="270" height="78" rx="11" class="gate"/>
  <text x="600" y="948" text-anchor="middle" class="head">乘 Sigmoid(Gate)</text>
  <text x="600" y="976" text-anchor="middle" class="note">逐元素调节拼接后的特征</text>

  <rect x="465" y="1021" width="270" height="70" rx="11" class="input"/>
  <text x="600" y="1050" text-anchor="middle" class="head">输出投影 o_proj</text>
  <text x="600" y="1077" text-anchor="middle" class="note">[B,T,4096]</text>

  <circle cx="800" cy="1056" r="30" fill="#F0FDF4" stroke="#16A34A" stroke-width="3"/>
  <text x="800" y="1066" text-anchor="middle" font-size="31" font-weight="700">+</text>
  <rect x="860" y="1028" width="200" height="56" rx="10" class="value"/>
  <text x="960" y="1052" text-anchor="middle" class="head">子层输出 Y</text>
  <text x="960" y="1074" text-anchor="middle" class="note">[B,T,4096]</text>

  <text x="122" y="905" class="note" fill="#7C3AED">q_proj 产生的 Gate</text>
  <text x="954" y="122" class="note">残差路径：原输入 X</text>

  <line x1="54" y1="1150" x2="94" y2="1150" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="108" y="1156" class="note">主计算</text>
  <line x1="190" y1="1150" x2="230" y2="1150" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="244" y="1156" class="note">输出门控</text>
  <line x1="350" y1="1150" x2="390" y2="1150" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="404" y="1156" class="note">残差路径</text>
</svg>
