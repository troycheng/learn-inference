<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1430" viewBox="0 0 1200 1430" role="img" aria-labelledby="title desc" data-min-container-gutter="18">
  <title id="title">Qwen3.5-9B 多头 Attention 子层的完整计算流程</title>
  <desc id="desc">输入隐藏状态经过 RMSNorm 和 Q、K、V 投影。Q、K 做按头归一化和 RoPE，随后各查询头计算缩放点积、因果遮罩、Softmax 和 V 的加权汇总。十六个头的输出拼接后乘输出门控，经过输出投影，再与原输入残差相加。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .title { font-size: 31px; font-weight: 700; }
      .head { font-size: 21px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 600; }
      .note { font-size: 16px; fill: #64748B; }
      .input { fill: #EFF6FF; stroke: #2563EB; stroke-width: 2; }
      .process { fill: #FFF7ED; stroke: #EA580C; stroke-width: 2; }
      .value { fill: #F0FDF4; stroke: #16A34A; stroke-width: 2; }
      .gate { fill: #FAF5FF; stroke: #7C3AED; stroke-width: 2; }
      .group { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 2; }
      .blue-route { fill: none; stroke: #2563EB; stroke-width: 2.5; }
      .blue-line { fill: none; stroke: #2563EB; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .gray-line { fill: none; stroke: #64748B; stroke-width: 2.5; marker-end: url(#arrow-gray); }
      .purple-line { fill: none; stroke: #7C3AED; stroke-width: 2.5; marker-end: url(#arrow-purple); }
    </style>
  </defs>

  <rect width="1200" height="1430" fill="#FFFFFF"/>
  <text x="54" y="58" class="title">Qwen3.5-9B：从输入 X 到 Attention 子层输出</text>
  <text x="54" y="92" class="note"><tspan fill="#2563EB">蓝色</tspan>是 Attention 主计算，<tspan fill="#7C3AED">紫色</tspan>是输出门控，<tspan fill="#64748B">灰色</tspan>是保留原输入的残差路径。</text>

  <!-- section backgrounds: reserve a header row above every group of nodes -->
  <rect id="projection-group" data-graph-role="container" x="54" y="320" width="1092" height="165" rx="14" class="group"/>
  <text x="78" y="350" class="head">三组投影</text>
  <rect id="head-shape-group" data-graph-role="container" x="54" y="515" width="1092" height="145" rx="14" class="group"/>
  <text x="78" y="545" class="head">按头整理</text>
  <rect id="single-head-group" data-graph-role="container" x="54" y="690" width="1092" height="205" rx="14" class="group"/>
  <text x="78" y="720" class="head">每个查询头完成同一套计算</text>
  <text x="78" y="875" class="note">GQA 映射：h1～h4 使用 g1，h5～h8 使用 g2，依此类推</text>

  <!-- connectors are behind nodes and keep the two side rails outside section titles -->
  <path d="M600 188 V220" class="blue-line"/>
  <path d="M600 284 V305 M250 305 H950" class="blue-route"/>
  <path d="M250 305 V370" class="blue-line"/>
  <path d="M600 305 V370" class="blue-line"/>
  <path d="M950 305 V370" class="blue-line"/>
  <path d="M250 460 V570" class="blue-line"/>
  <path d="M600 460 V570" class="blue-line"/>
  <path d="M950 460 V570" class="blue-line"/>
  <path d="M250 635 V675 H300 V755" class="blue-line"/>
  <path d="M600 635 V675 H380 V755" class="blue-line"/>
  <path d="M950 635 V675 H815 V755" class="blue-line"/>
  <path d="M430 800 H490" class="blue-line"/>
  <path d="M660 800 H720" class="blue-line"/>
  <path d="M910 800 H940" class="blue-line"/>
  <path d="M1034 845 V915 H600 V935" class="blue-line"/>
  <path d="M600 1013 V1045" class="blue-line"/>
  <path d="M600 1123 V1155" class="blue-line"/>
  <path d="M600 1225 V1250" class="blue-line"/>
  <path d="M600 1310 V1330" class="blue-line"/>

  <path d="M130 415 H30 V1084 H465" class="purple-line"/>
  <path d="M690 154 H1170 V1280 H630" class="gray-line"/>

  <!-- input and normalization -->
  <rect data-graph-role="node" data-node-id="input-x" x="510" y="120" width="180" height="68" rx="10" class="input"/>
  <text x="600" y="148" text-anchor="middle" class="head">输入 X</text>
  <text x="600" y="173" text-anchor="middle" class="note">[B,T,4096]</text>
  <rect data-graph-role="node" data-node-id="rmsnorm" x="510" y="220" width="180" height="64" rx="10" class="input"/>
  <text x="600" y="259" text-anchor="middle" class="head">RMSNorm</text>
  <text x="936" y="143" class="note">残差路径保留原输入 X</text>

  <!-- projections -->
  <rect data-graph-role="node" data-node-id="q-proj" x="130" y="370" width="240" height="90" rx="10" class="input"/>
  <text x="250" y="397" text-anchor="middle" class="label">q_proj：每个头内拆分</text>
  <text x="250" y="424" text-anchor="middle" class="note">[B,T,16,512]</text>
  <text x="250" y="449" text-anchor="middle" class="note">每头 = Q 256 + Gate 256</text>
  <rect data-graph-role="node" data-node-id="k-proj" x="480" y="370" width="240" height="90" rx="10" class="input"/>
  <text x="600" y="405" text-anchor="middle" class="label">k_proj</text>
  <text x="600" y="435" text-anchor="middle" class="note">K [B,4,T,256]</text>
  <rect data-graph-role="node" data-node-id="v-proj" x="830" y="370" width="240" height="90" rx="10" class="input"/>
  <text x="950" y="405" text-anchor="middle" class="label">v_proj</text>
  <text x="950" y="435" text-anchor="middle" class="note">V [B,4,T,256]</text>

  <!-- head preparation -->
  <rect data-graph-role="node" data-node-id="q-heads" x="130" y="570" width="240" height="65" rx="10" class="process"/>
  <text x="250" y="598" text-anchor="middle" class="label">Q：按头 RMSNorm + RoPE</text>
  <text x="250" y="623" text-anchor="middle" class="note">16 个查询头</text>
  <rect data-graph-role="node" data-node-id="k-heads" x="480" y="570" width="240" height="65" rx="10" class="process"/>
  <text x="600" y="598" text-anchor="middle" class="label">K：按头 RMSNorm + RoPE</text>
  <text x="600" y="623" text-anchor="middle" class="note">4 个 K 头</text>
  <rect data-graph-role="node" data-node-id="v-heads" x="830" y="570" width="240" height="65" rx="10" class="value"/>
  <text x="950" y="598" text-anchor="middle" class="label">V：调整为按头 shape</text>
  <text x="950" y="623" text-anchor="middle" class="note">V 不做 RoPE</text>

  <!-- one query head -->
  <rect data-graph-role="node" data-node-id="score" x="130" y="755" width="300" height="90" rx="10" class="process"/>
  <text x="280" y="785" text-anchor="middle" class="label">① Q(h) 与对应的 K(g) 打分</text>
  <text x="280" y="813" text-anchor="middle" class="note">Q(h) · K(g)ᵀ / √256 + M</text>
  <text x="280" y="836" text-anchor="middle" class="note">Score [B,16,T,T]</text>
  <rect data-graph-role="node" data-node-id="softmax" x="490" y="755" width="170" height="90" rx="10" class="process"/>
  <text x="575" y="788" text-anchor="middle" class="label">② Softmax</text>
  <text x="575" y="817" text-anchor="middle" class="note">每行变成权重</text>
  <rect data-graph-role="node" data-node-id="weighted-v" x="720" y="755" width="190" height="90" rx="10" class="value"/>
  <text x="815" y="788" text-anchor="middle" class="label">③ 权重 × V(g)</text>
  <text x="815" y="817" text-anchor="middle" class="note">汇总可见位置的 V</text>
  <rect data-graph-role="node" data-node-id="head-output" x="940" y="755" width="188" height="90" rx="10" class="value"/>
  <text x="1034" y="788" text-anchor="middle" class="label">④ 得到各查询头输出</text>
  <text x="1034" y="817" text-anchor="middle" class="note">合为 [B,16,T,256]</text>

  <!-- merge heads, gate, project, then add the untouched residual -->
  <rect data-graph-role="node" data-node-id="concat" x="465" y="935" width="270" height="78" rx="11" class="value"/>
  <text x="600" y="964" text-anchor="middle" class="head">调整轴顺序并 Concat</text>
  <text x="600" y="992" text-anchor="middle" class="note">[B,T,16×256] = [B,T,4096]</text>
  <text x="54" y="1028" class="note" fill="#7C3AED">q_proj 产生的 Gate 沿左侧送到这里</text>
  <rect data-graph-role="node" data-node-id="output-gate" x="465" y="1045" width="270" height="78" rx="11" class="gate"/>
  <text x="600" y="1074" text-anchor="middle" class="head">乘 Sigmoid(Gate)</text>
  <text x="600" y="1102" text-anchor="middle" class="note">逐元素调节拼接后的特征</text>
  <rect data-graph-role="node" data-node-id="o-proj" x="465" y="1155" width="270" height="70" rx="11" class="input"/>
  <text x="600" y="1184" text-anchor="middle" class="head">输出投影 o_proj</text>
  <text x="600" y="1211" text-anchor="middle" class="note">[B,T,4096]</text>
  <circle data-graph-role="node" data-node-id="residual-add" cx="600" cy="1280" r="30" fill="#F0FDF4" stroke="#16A34A" stroke-width="3"/>
  <text x="600" y="1290" text-anchor="middle" font-size="31" font-weight="700">+</text>
  <text x="660" y="1264" class="note">与原输入 X 逐元素相加</text>
  <rect data-graph-role="node" data-node-id="output-y" x="500" y="1330" width="200" height="56" rx="10" class="value"/>
  <text x="600" y="1354" text-anchor="middle" class="head">子层输出 Y</text>
  <text x="600" y="1376" text-anchor="middle" class="note">[B,T,4096]</text>
</svg>
