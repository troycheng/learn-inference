<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720">
  <defs><marker id="d" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker></defs>
  <style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#6b7280}.h{font-size:18px;font-weight:700;text-anchor:middle}.t{font-size:15px;text-anchor:middle}.line{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#d)}</style>
  <rect width="1400" height="720" fill="#fff"/><text x="70" y="58" class="title">视觉位置增加，不只会加重视觉编码器</text><text x="70" y="92" class="sub">视觉向量还会进入语言模型的 Prefill，并成为请求前缀的一部分。</text>
  <rect x="55" y="285" width="230" height="120" rx="15" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="170" y="328" class="h">更多视觉位置</text><text x="170" y="365" class="t">更高分辨率、更多图片</text>
  <path d="M285 345 H390 V185 H485" class="line"/><path d="M285 345 H485" class="line"/><path d="M285 345 H390 V515 H485" class="line"/>
  <rect x="485" y="125" width="300" height="120" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="635" y="167" class="h">视觉塔计算增加</text><text x="635" y="204" class="t">Patch、Attention、MLP、Merger</text>
  <rect x="485" y="285" width="300" height="120" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="635" y="327" class="h">语言 Prefill 变长</text><text x="635" y="364" class="t">更多位置进入全部 Decoder Layer</text>
  <rect x="485" y="455" width="300" height="120" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="635" y="497" class="h">请求状态增加或更新</text><text x="635" y="534" class="t">Full Attention KV + GDN 状态更新</text>
  <path d="M785 185 H900 V345 H990" class="line"/><path d="M785 345 H990" class="line"/><path d="M785 515 H900 V345 H990" class="line"/>
  <rect x="990" y="285" width="340" height="120" rx="15" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="1160" y="327" class="h">首 token 延迟和显存压力上升</text><text x="1160" y="364" class="t">具体比例由 shape、Batch 和 runtime 决定</text>
  <rect x="55" y="635" width="1275" height="45" rx="10" fill="#f8fafc"/><text x="693" y="664" class="sub" text-anchor="middle">后续 Decode 通常不重跑视觉塔，但会继续使用 Prefill 建立的语言模型状态。</text>
</svg>
