<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" data-min-container-gutter="18">
  <title id="title">RoPE 在 Attention 计算流程中的位置</title>
  <desc id="desc">隐藏状态分别产生 Q、K、V。Q 和 K 按头整理并归一化后，根据各自的位置应用 RoPE；V 不旋转。旋转后的 Q 和 K 计算 Attention 分数，Softmax 权重再汇总 V。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .title { font-size: 31px; font-weight: 700; }
      .stage { font-size: 19px; font-weight: 700; fill: #334155; }
      .label { font-size: 18px; font-weight: 600; }
      .note { font-size: 15px; fill: #64748B; }
      .input { fill: #EFF6FF; stroke: #2563EB; stroke-width: 2; }
      .process { fill: #FFF7ED; stroke: #EA580C; stroke-width: 2; }
      .rope { fill: #FAF5FF; stroke: #7C3AED; stroke-width: 2; }
      .value { fill: #F0FDF4; stroke: #16A34A; stroke-width: 2; }
      .group { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 2; }
      .line { fill: none; stroke: #2563EB; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .route { fill: none; stroke: #2563EB; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#FFFFFF"/>
  <text x="54" y="58" class="title">RoPE 在 Attention 计算流程中的位置</text>
  <text x="54" y="92" class="note">Q/K 投影后先按头整理，再按各自位置旋转；V 不旋转。RoPE 前后，张量 shape 保持不变。</text>

  <!-- stage 4 background is placed before the connectors so the flow lines remain visible -->
  <rect id="attention-group" data-graph-role="container" x="54" y="675" width="1092" height="175" rx="14" class="group"/>

  <!-- connectors: a regular three-column layout with no return rails -->
  <path d="M600 190 V225 M240 225 H960" class="route"/>
  <path d="M240 225 V250" class="line"/>
  <path d="M600 225 V250" class="line"/>
  <path d="M960 225 V250" class="line"/>
  <path d="M240 330 V375" class="line"/>
  <path d="M600 330 V375" class="line"/>
  <path d="M960 330 V375" class="line"/>
  <path d="M240 455 V505" class="line"/>
  <path d="M600 455 V505" class="line"/>
  <path d="M960 455 V505" class="line"/>
  <path d="M240 615 V650 H470" class="route"/>
  <path d="M600 615 V650 H470" class="route"/>
  <path d="M470 650 V715" class="line"/>
  <path d="M960 615 V665 H985 V715" class="line"/>
  <path d="M500 765 H560" class="line"/>
  <path d="M740 765 H800" class="line"/>
  <circle cx="470" cy="650" r="5" fill="#2563EB"/>

  <!-- input -->
  <rect data-graph-role="node" data-node-id="hidden-x" x="500" y="120" width="200" height="70" rx="11" class="input"/>
  <text x="600" y="150" text-anchor="middle" class="label">隐藏状态 X</text>
  <text x="600" y="176" text-anchor="middle" class="note">[B,T,H]</text>

  <!-- stage 1: projections -->
  <text x="54" y="250" class="stage">1. Q、K、V 投影</text>
  <rect data-graph-role="node" data-node-id="q-proj" x="140" y="260" width="200" height="70" rx="10" class="input"/>
  <text x="240" y="290" text-anchor="middle" class="label">q_proj</text>
  <text x="240" y="315" text-anchor="middle" class="note">取出 Q 分支</text>
  <rect data-graph-role="node" data-node-id="k-proj" x="500" y="260" width="200" height="70" rx="10" class="input"/>
  <text x="600" y="290" text-anchor="middle" class="label">k_proj</text>
  <text x="600" y="315" text-anchor="middle" class="note">Linear 得到 K</text>
  <rect data-graph-role="node" data-node-id="v-proj" x="860" y="260" width="200" height="70" rx="10" class="input"/>
  <text x="960" y="290" text-anchor="middle" class="label">v_proj</text>
  <text x="960" y="315" text-anchor="middle" class="note">Linear 得到 V</text>

  <!-- stage 2: arrange heads -->
  <text x="54" y="375" class="stage">2. 按头整理</text>
  <rect data-graph-role="node" data-node-id="q-heads" x="140" y="385" width="200" height="70" rx="10" class="process"/>
  <text x="240" y="415" text-anchor="middle" class="label">Q 按查询头整理</text>
  <text x="240" y="440" text-anchor="middle" class="note">每头 RMSNorm</text>
  <rect data-graph-role="node" data-node-id="k-heads" x="500" y="385" width="200" height="70" rx="10" class="process"/>
  <text x="600" y="415" text-anchor="middle" class="label">K 按 K 头整理</text>
  <text x="600" y="440" text-anchor="middle" class="note">每头 RMSNorm</text>
  <rect data-graph-role="node" data-node-id="v-heads" x="860" y="385" width="200" height="70" rx="10" class="process"/>
  <text x="960" y="415" text-anchor="middle" class="label">V 按 V 头整理</text>
  <text x="960" y="440" text-anchor="middle" class="note">只调整 shape</text>

  <!-- stage 3: position handling -->
  <text x="54" y="505" class="stage">3. 位置处理</text>
  <rect data-graph-role="node" data-node-id="q-rope" x="140" y="515" width="200" height="100" rx="11" class="rope"/>
  <text x="240" y="547" text-anchor="middle" class="label">RoPE(m) → Q'</text>
  <text x="240" y="574" text-anchor="middle" class="note">位置 m 生成 cos / sin</text>
  <text x="240" y="598" text-anchor="middle" class="note">Q' 用于本轮打分</text>
  <rect data-graph-role="node" data-node-id="k-rope" x="500" y="515" width="200" height="100" rx="11" class="rope"/>
  <text x="600" y="547" text-anchor="middle" class="label">RoPE(n) → K'</text>
  <text x="600" y="574" text-anchor="middle" class="note">位置 n 生成 cos / sin</text>
  <text x="600" y="598" text-anchor="middle" class="note">K' 写入 KV Cache</text>
  <rect data-graph-role="node" data-node-id="v-no-rope" x="860" y="515" width="200" height="100" rx="11" class="value"/>
  <text x="960" y="547" text-anchor="middle" class="label">V 原样通过</text>
  <text x="960" y="574" text-anchor="middle" class="note">不做 RoPE</text>
  <text x="960" y="598" text-anchor="middle" class="note">V 写入 KV Cache</text>

  <!-- stage 4: original Attention continues -->
  <text x="78" y="707" class="stage">4. 继续执行原来的 Attention 计算</text>
  <rect data-graph-role="node" data-node-id="score" x="200" y="725" width="300" height="80" rx="11" class="process"/>
  <text x="350" y="755" text-anchor="middle" class="label">旋转后的 Q'、K' 计算分数</text>
  <text x="350" y="783" text-anchor="middle" class="note">Q' · K' / √D + 因果遮罩</text>
  <rect data-graph-role="node" data-node-id="softmax" x="570" y="725" width="170" height="80" rx="11" class="process"/>
  <text x="655" y="755" text-anchor="middle" class="label">Softmax</text>
  <text x="655" y="783" text-anchor="middle" class="note">分数变成权重</text>
  <rect data-graph-role="node" data-node-id="output" x="810" y="725" width="300" height="80" rx="11" class="value"/>
  <text x="960" y="755" text-anchor="middle" class="label">权重汇总未旋转的 V</text>
  <text x="960" y="783" text-anchor="middle" class="note">得到单头输出 O=[B,T,D]</text>
  <text x="600" y="834" text-anchor="middle" class="note">Qwen3.5-9B Full Attention 每头只旋转前 64 维，其余 192 维原样通过。</text>
</svg>
