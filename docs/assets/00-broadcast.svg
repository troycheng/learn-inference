<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="title desc">
  <title id="title">每个 token 的一个系数怎样沿 H 维广播</title>
  <desc id="desc">两条三维 token 向量分别乘以 0.5 和 2.0。长度为 1 的最后一维广播到三个特征坐标，输出 shape 保持为 2、3。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #6b7280; }
    .heading { font-size: 18px; font-weight: 700; text-anchor: middle; }
    .shape { font-size: 15px; fill: #4b5563; text-anchor: middle; }
    .value { font-size: 18px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; }
    .note { font-size: 15px; fill: #374151; }
  </style>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="50" y="55" class="title">每个 token 使用自己的缩放系数</text>
  <text x="50" y="85" class="subtitle">[T,H] × [T,1]：最后一维的 1 沿 H 维广播，不会把两个 token 的系数混在一起</text>

  <text x="245" y="145" class="heading">token 向量 X</text>
  <text x="245" y="170" class="shape">shape=[2,3]</text>
  <rect x="70" y="195" width="350" height="150" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="110" y="250" class="note">token 0</text>
  <text x="250" y="250" class="value">[ 2, 4, 6 ]</text>
  <line x1="95" y1="270" x2="395" y2="270" stroke="#bfdbfe"/>
  <text x="110" y="315" class="note">token 1</text>
  <text x="250" y="315" class="value">[ 1, 3, 5 ]</text>

  <text x="515" y="145" class="heading">缩放系数</text>
  <text x="515" y="170" class="shape">shape=[2,1]</text>
  <rect x="455" y="195" width="120" height="150" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="515" y="250" class="value">0.5</text>
  <line x1="475" y1="270" x2="555" y2="270" stroke="#fed7aa"/>
  <text x="515" y="315" class="value">2.0</text>

  <path d="M600 270 H690" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="645" y="250" class="heading">逐元素乘</text>

  <text x="930" y="145" class="heading">输出</text>
  <text x="930" y="170" class="shape">shape=[2,3]</text>
  <rect x="745" y="195" width="370" height="150" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="785" y="250" class="note">token 0</text>
  <text x="948" y="250" class="value">[ 1, 2, 3 ]</text>
  <line x1="770" y1="270" x2="1090" y2="270" stroke="#a7f3d0"/>
  <text x="785" y="315" class="note">token 1</text>
  <text x="948" y="315" class="value">[ 2, 6, 10 ]</text>

  <rect x="70" y="405" width="1045" height="95" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="100" y="442" class="note">token 0：0.5 同时乘到 2、4、6 三个坐标　→　[1,2,3]</text>
  <text x="100" y="477" class="note">token 1：2.0 同时乘到 1、3、5 三个坐标　→　[2,6,10]</text>
</svg>
