<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3.5-9B 检查点的参数组成</title>
  <desc id="desc">总计 96.53 亿参数，其中约 92.76% 属于文本模型、Embedding 和 LM Head，4.72% 属于视觉编码器与 Merger，2.52% 属于 MTP 辅助层。横条宽度按参数比例绘制。</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
    .title { font-size: 32px; font-weight: 700; }
    .sub { font-size: 17px; fill: #6b7280; }
    .card-title { font-size: 19px; font-weight: 700; }
    .number { font-size: 26px; font-weight: 700; }
    .percent { font-size: 17px; font-weight: 700; }
    .body { font-size: 15px; fill: #4b5563; }
    .on-dark { fill: #ffffff; }
  </style>
  <defs>
    <clipPath id="bar-clip">
      <rect x="55" y="160" width="1290" height="110" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1400" height="720" fill="#ffffff" data-graph-role="canvas"/>
  <g data-graph-role="title-block">
    <text x="55" y="58" class="title">Qwen3.5-9B 检查点的参数组成</text>
    <text x="55" y="92" class="sub">横条按参数数量的真实比例绘制；视觉塔和 MTP 也在检查点总数中。</text>
  </g>

  <g clip-path="url(#bar-clip)" aria-label="参数比例横条">
    <rect x="55" y="160" width="1197" height="110" fill="#2563eb"/>
    <rect x="1252" y="160" width="61" height="110" fill="#fb923c"/>
    <rect x="1313" y="160" width="32" height="110" fill="#8b5cf6"/>
  </g>
  <rect x="55" y="160" width="1290" height="110" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" data-graph-role="decoration"/>
  <text x="82" y="208" class="on-dark" font-size="20" font-weight="700">文本模型、Embedding、LM Head</text>
  <text x="82" y="242" class="on-dark" font-size="18">92.76%</text>

  <g data-graph-role="node" aria-label="文本模型参数">
    <rect x="55" y="330" width="400" height="205" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="83" y="360" width="18" height="18" rx="4" fill="#2563eb"/>
    <text x="117" y="376" class="card-title">文本模型、Embedding、LM Head</text>
    <text x="83" y="432" class="number">8,953,799,424</text>
    <text x="83" y="470" class="percent">占 92.756%</text>
    <text x="83" y="505" class="body">决定绝大部分检查点参数</text>
  </g>

  <g data-graph-role="node" aria-label="视觉编码器参数">
    <rect x="500" y="330" width="400" height="205" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <rect x="528" y="360" width="18" height="18" rx="4" fill="#fb923c"/>
    <text x="562" y="376" class="card-title">视觉编码器与 Merger</text>
    <text x="528" y="432" class="number">456,010,480</text>
    <text x="528" y="470" class="percent">占 4.724%</text>
    <text x="528" y="505" class="body">只有多模态输入会执行视觉塔</text>
  </g>

  <g data-graph-role="node" aria-label="MTP 辅助层参数">
    <rect x="945" y="330" width="400" height="205" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="973" y="360" width="18" height="18" rx="4" fill="#8b5cf6"/>
    <text x="1007" y="376" class="card-title">MTP 辅助层</text>
    <text x="973" y="432" class="number">243,294,464</text>
    <text x="973" y="470" class="percent">占 2.520%</text>
    <text x="973" y="505" class="body">普通单 token 生成可以不执行</text>
  </g>

  <g data-graph-role="annotation">
    <rect x="280" y="580" width="840" height="82" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="700" y="614" class="card-title" text-anchor="middle">合计 9,653,104,368 个参数</text>
    <text x="700" y="645" class="body" text-anchor="middle">“9B”是取整名称；部署时还要确认视觉塔和 MTP 是否实际加载与执行。</text>
  </g>
</svg>
