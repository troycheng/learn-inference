<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">位置 3 的一次 Attention 读取</title>
  <desc id="desc">位置 3 的查询向量与三个键向量比较，得到三个权重。每个权重分别乘对应的值向量，三项相加后得到位置 3 的单头输出。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16A34A"/></marker>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .title { font-size: 32px; font-weight: 700; }
      .section { font-size: 22px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 600; }
      .note { font-size: 16px; fill: #64748B; }
      .query { fill: #EFF6FF; stroke: #2563EB; stroke-width: 2; }
      .key { fill: #FFF7ED; stroke: #EA580C; stroke-width: 2; }
      .weight { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 2; }
      .value { fill: #F0FDF4; stroke: #16A34A; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="650" fill="#FFFFFF"/>
  <text x="54" y="58" class="title">位置 3 的一次读取：先算权重，再汇总 V</text>
  <text x="54" y="92" class="note">Q/K 只负责匹配；得到的一整行权重才会分别乘到 V1、V2、V3 上。</text>

  <text x="54" y="145" class="section">1  Q3 与每条 K 比较</text>
  <rect x="54" y="190" width="205" height="96" rx="12" class="query"/>
  <text x="156" y="226" text-anchor="middle" class="label">位置 3：“它”</text>
  <text x="156" y="258" text-anchor="middle" class="label">查询 Q3</text>

  <path d="M259 238 H310 V167 H374" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M310 238 H374" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M310 238 V309 H374" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <rect x="374" y="132" width="210" height="70" rx="10" class="key"/>
  <text x="479" y="160" text-anchor="middle" class="label">小明的 K1</text>
  <text x="479" y="184" text-anchor="middle" class="note">候选位置 1</text>
  <rect x="374" y="203" width="210" height="70" rx="10" class="key"/>
  <text x="479" y="231" text-anchor="middle" class="label">杯子的 K2</text>
  <text x="479" y="255" text-anchor="middle" class="note">候选位置 2</text>
  <rect x="374" y="274" width="210" height="70" rx="10" class="key"/>
  <text x="479" y="302" text-anchor="middle" class="label">“它”的 K3</text>
  <text x="479" y="326" text-anchor="middle" class="note">候选位置 3</text>

  <path d="M584 167 H678" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M584 238 H678" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M584 309 H678" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="678" y="132" width="220" height="70" rx="10" class="weight"/>
  <text x="788" y="174" text-anchor="middle" class="label">位置 1 分数 → w1</text>
  <rect x="678" y="203" width="220" height="70" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="788" y="245" text-anchor="middle" class="label">位置 2 分数 → w2</text>
  <rect x="678" y="274" width="220" height="70" rx="10" class="weight"/>
  <text x="788" y="316" text-anchor="middle" class="label">位置 3 分数 → w3</text>
  <text x="932" y="220" class="note">三个权重经过</text>
  <text x="932" y="247" class="note">Softmax 后总和为 1</text>

  <line x1="54" y1="383" x2="1146" y2="383" stroke="#E2E8F0" stroke-width="2"/>
  <text x="54" y="430" class="section">2  每个权重乘对应的 V，三项相加</text>

  <rect x="54" y="465" width="250" height="84" rx="11" class="value"/>
  <text x="179" y="498" text-anchor="middle" class="label">小明的 V1 × w1</text>
  <text x="179" y="526" text-anchor="middle" class="note">位置 1 的贡献</text>
  <rect x="344" y="465" width="250" height="84" rx="11" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/>
  <text x="469" y="498" text-anchor="middle" class="label">杯子的 V2 × w2</text>
  <text x="469" y="526" text-anchor="middle" class="note">位置 2 的贡献</text>
  <rect x="634" y="465" width="250" height="84" rx="11" class="value"/>
  <text x="759" y="498" text-anchor="middle" class="label">“它”的 V3 × w3</text>
  <text x="759" y="526" text-anchor="middle" class="note">位置 3 的贡献</text>

  <path d="M304 507 C360 507 350 588 918 588" fill="none" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M594 507 C650 507 640 588 918 588" fill="none" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M884 507 C918 507 900 588 918 588" fill="none" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="918" y="546" width="228" height="84" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/>
  <text x="1032" y="581" text-anchor="middle" class="label">位置 3 的单头输出</text>
  <text x="1032" y="609" text-anchor="middle" class="note">O3 = w1V1 + w2V2 + w3V3</text>
</svg>
