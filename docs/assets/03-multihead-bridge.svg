<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">从一个 Attention 头扩展到多个头</title>
  <desc id="desc">同一组 token 隐藏状态同时进入两个 Attention 头。每个头使用自己的投影和独立的 Attention 权重，得到一条输出向量。各头输出沿特征维拼接，再进入输出投影。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .title { font-size: 31px; font-weight: 700; }
      .head { font-size: 21px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 600; }
      .note { font-size: 16px; fill: #64748B; }
      .input { fill: #EFF6FF; stroke: #2563EB; stroke-width: 2; }
      .frame { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 2; }
      .process { fill: #FFF7ED; stroke: #EA580C; stroke-width: 2; }
      .output { fill: #F0FDF4; stroke: #16A34A; stroke-width: 2; }
      .line { fill: none; stroke: #2563EB; stroke-width: 2.5; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect width="1200" height="650" fill="#FFFFFF"/>
  <text x="54" y="58" class="title">前面的手算，就是多头 Attention 中的一个头</text>
  <text x="54" y="92" class="note">每个头读取同一组 token 位置，但使用不同的投影权重，因此会得到不同的匹配分数和输出。</text>

  <rect x="54" y="270" width="185" height="108" rx="12" class="input"/>
  <text x="146" y="309" text-anchor="middle" class="head">同一组隐藏状态</text>
  <text x="146" y="339" text-anchor="middle" class="label">x1，x2，x3</text>
  <text x="146" y="365" text-anchor="middle" class="note">[B,T,H]</text>

  <path d="M239 310 H275 V211 H315" class="line"/>
  <path d="M239 338 H275 V451 H315" class="line"/>

  <rect x="315" y="130" width="600" height="180" rx="14" class="frame"/>
  <text x="343" y="166" class="head">查询头 h=1</text>
  <text x="343" y="193" class="note">沿用前面位置 3 的手算</text>
  <rect x="343" y="215" width="185" height="66" rx="10" class="input"/>
  <text x="435" y="242" text-anchor="middle" class="label">第 1 组 Q/K/V 投影</text>
  <text x="435" y="267" text-anchor="middle" class="note">WQ¹，WK¹，WV¹</text>
  <path d="M528 248 H575" class="line"/>
  <rect x="575" y="205" width="205" height="86" rx="10" class="process"/>
  <text x="677" y="237" text-anchor="middle" class="label">打分 → Softmax</text>
  <text x="677" y="264" text-anchor="middle" class="note">权重汇总 V</text>
  <path d="M780 248 H818" class="line"/>
  <rect x="818" y="205" width="175" height="86" rx="10" class="output"/>
  <text x="905" y="237" text-anchor="middle" class="label">O₃⁽¹⁾</text>
  <text x="905" y="264" text-anchor="middle" class="note">[0.745, 1.255]</text>

  <rect x="315" y="370" width="600" height="180" rx="14" class="frame"/>
  <text x="343" y="406" class="head">查询头 h=2</text>
  <text x="343" y="433" class="note">同样读取位置 1、2、3，投影权重不同</text>
  <rect x="343" y="455" width="185" height="66" rx="10" class="input"/>
  <text x="435" y="482" text-anchor="middle" class="label">第 2 组 Q/K/V 投影</text>
  <text x="435" y="507" text-anchor="middle" class="note">WQ²，WK²，WV²</text>
  <path d="M528 488 H575" class="line"/>
  <rect x="575" y="445" width="205" height="86" rx="10" class="process"/>
  <text x="677" y="477" text-anchor="middle" class="label">打分 → Softmax</text>
  <text x="677" y="504" text-anchor="middle" class="note">权重汇总 V</text>
  <path d="M780 488 H818" class="line"/>
  <rect x="818" y="445" width="175" height="86" rx="10" class="output"/>
  <text x="905" y="477" text-anchor="middle" class="label">O₃⁽²⁾</text>
  <text x="905" y="504" text-anchor="middle" class="note">另一条 [D] 向量</text>

  <path d="M993 248 H1020 V306 H1040" class="line"/>
  <path d="M993 488 H1020 V354 H1040" class="line"/>
  <rect x="1040" y="270" width="125" height="120" rx="12" class="output"/>
  <text x="1102" y="307" text-anchor="middle" class="head">Concat</text>
  <text x="1102" y="338" text-anchor="middle" class="label">[O₃⁽¹⁾ | O₃⁽²⁾]</text>
  <text x="1102" y="366" text-anchor="middle" class="note">shape=[2D]</text>

  <rect x="315" y="585" width="850" height="44" rx="9" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="740" y="613" text-anchor="middle" class="note">头数增加的是匹配方式，不是 token 位置；每个头仍然对可见位置完成同一套 Attention 计算。</text>
</svg>
