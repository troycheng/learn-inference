<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 920" role="img" aria-labelledby="title desc">
  <title id="title">一个 token 经过 Gated DeltaNet 的完整数据流</title>
  <desc id="desc">隐藏状态经过投影、因果卷积、QKV 拆分、状态更新和读取、输出门与输出投影。卷积状态和递归状态在 token 之间保留。</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
    .title { font-size: 36px; font-weight: 700; }
    .subtitle { font-size: 20px; fill: #64748b; }
    .label { font-size: 23px; font-weight: 650; }
    .body { font-size: 18px; }
    .shape { font-size: 17px; fill: #64748b; }
    .note { font-size: 17px; fill: #64748b; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-green-start" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto-start-reverse">
      <polygon points="10 0, 0 3.5, 10 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="2400" height="920" fill="#ffffff"/>
  <text x="55" y="64" class="title">一个 token 经过 Gated DeltaNet 的完整过程</text>
  <text x="55" y="103" class="subtitle">蓝色是当前 token 的主数据流，绿色是跨 token 保留的状态，橙色是 α、β 和 z 控制分支。</text>

  <path d="M 240 275 H 300" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 550 275 H 620" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 880 275 H 950" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 1200 275 H 1270" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 1600 275 H 1670" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 1950 275 H 2010" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 2190 275 H 2250" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <path d="M 425 350 V 410 H 1360 V 365" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="930" y="399" text-anchor="middle" class="body">a → g → α，b → β</text>
  <path d="M 475 350 V 455 H 1810 V 350" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="1120" y="444" text-anchor="middle" class="body">z</text>

  <path d="M 750 350 V 565" fill="none" stroke="#16a34a" stroke-width="3" marker-start="url(#arrow-green-start)" marker-end="url(#arrow-green)"/>
  <text x="770" y="470" class="body">读取 / 写回</text>
  <path d="M 1500 365 V 565" fill="none" stroke="#16a34a" stroke-width="3" marker-start="url(#arrow-green-start)" marker-end="url(#arrow-green)"/>
  <text x="1520" y="495" class="body">读取 / 写回</text>

  <rect x="60" y="225" width="180" height="100" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="150" y="266" text-anchor="middle" class="label">输入 X</text>
  <text x="150" y="297" text-anchor="middle" class="shape">[B,T,H]</text>

  <rect x="300" y="200" width="250" height="150" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="425" y="240" text-anchor="middle" class="label">四组 Linear</text>
  <text x="425" y="276" text-anchor="middle" class="body">混合 Q/K/V</text>
  <text x="425" y="308" text-anchor="middle" class="body">并产生 a、b、z</text>
  <text x="425" y="334" text-anchor="middle" class="shape">[B,T,H] → 多条分支</text>

  <rect x="620" y="200" width="260" height="150" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="750" y="240" text-anchor="middle" class="label">因果卷积与 SiLU</text>
  <text x="750" y="277" text-anchor="middle" class="body">读取最近 4 个位置</text>
  <text x="750" y="309" text-anchor="middle" class="body">每个通道独立卷积</text>
  <text x="750" y="334" text-anchor="middle" class="shape">混合 Q/K/V 通道</text>

  <rect x="950" y="200" width="250" height="150" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="1075" y="240" text-anchor="middle" class="label">拆分 Q、K、V</text>
  <text x="1075" y="277" text-anchor="middle" class="body">Q/K 扩展到 32 头</text>
  <text x="1075" y="309" text-anchor="middle" class="body">Q/K 做 L2 归一化</text>
  <text x="1075" y="334" text-anchor="middle" class="shape">每头 Dk=Dv=128</text>

  <rect x="1270" y="185" width="330" height="180" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="2.5"/>
  <text x="1435" y="225" text-anchor="middle" class="label">更新状态并读取输出</text>
  <text x="1310" y="263" class="body">1. α 衰减旧状态</text>
  <text x="1310" y="294" class="body">2. K 读取旧值</text>
  <text x="1310" y="325" class="body">3. β 缩放误差并写回</text>
  <text x="1310" y="356" class="body">4. Q 读取更新后的状态</text>

  <rect x="1670" y="200" width="280" height="150" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="1810" y="240" text-anchor="middle" class="label">输出门</text>
  <text x="1810" y="280" text-anchor="middle" class="body">RMSNorm(o)</text>
  <text x="1810" y="312" text-anchor="middle" class="body">× SiLU(z)</text>
  <text x="1810" y="337" text-anchor="middle" class="shape">z 只调节当前输出</text>

  <rect x="2010" y="215" width="180" height="120" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="2100" y="260" text-anchor="middle" class="label">out_proj</text>
  <text x="2100" y="294" text-anchor="middle" class="body">拼回所有头</text>
  <text x="2100" y="319" text-anchor="middle" class="shape">回到 H 维</text>

  <rect x="2250" y="225" width="100" height="100" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="2300" y="266" text-anchor="middle" class="label">输出</text>
  <text x="2300" y="297" text-anchor="middle" class="shape">[B,T,H]</text>

  <rect x="620" y="565" width="260" height="135" rx="16" fill="#f0fdf4" stroke="#34d399" stroke-width="2"/>
  <text x="750" y="607" text-anchor="middle" class="label">conv_state</text>
  <text x="750" y="642" text-anchor="middle" class="body">保存最近 4 个位置</text>
  <text x="750" y="673" text-anchor="middle" class="shape">[B,8192,4]</text>

  <rect x="1270" y="565" width="330" height="135" rx="16" fill="#f0fdf4" stroke="#34d399" stroke-width="2"/>
  <text x="1435" y="607" text-anchor="middle" class="label">recurrent_state</text>
  <text x="1435" y="642" text-anchor="middle" class="body">每头一张 128×128 状态矩阵</text>
  <text x="1435" y="673" text-anchor="middle" class="shape">[B,32,128,128]</text>

  <line x1="60" y1="835" x2="105" y2="835" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="125" y="842" class="note">当前 token 的数据流</text>
  <line x1="390" y1="835" x2="435" y2="835" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="455" y="842" class="note">跨 token 保留的状态</text>
  <line x1="770" y1="835" x2="815" y2="835" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="835" y="842" class="note">控制分支</text>
  <text x="2340" y="842" text-anchor="end" class="note">两份状态在每个 Gated DeltaNet 层中分别保存。</text>
</svg>
