      <rect x="0" y="20" width="42" height="104" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><rect x="46" y="20" width="42" height="104" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><rect x="92" y="20" width="42" height="104" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><rect x="138" y="20" width="42" height="104" rx="8" fill="#fed7aa" stroke="#fb923c" stroke-width="2"/>
