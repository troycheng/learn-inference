  <rect x="150" y="330" width="410" height="56" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="835" y="330" width="410" height="56" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="355" y="365" class="note">D：Gated DeltaNet，固定 shape 状态</text>
  <text x="1040" y="365" class="note">A：Full Attention，随长度增长的 K/V</text>
