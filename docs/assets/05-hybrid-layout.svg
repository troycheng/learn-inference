<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" width="1400" height="430">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
    .title { font-size: 32px; font-weight: 700; }
    .sub { font-size: 17px; fill: #6b7280; }
    .group { font-size: 16px; font-weight: 600; }
    .cell { font-size: 15px; font-weight: 600; text-anchor: middle; }
    .note { font-size: 17px; font-weight: 600; text-anchor: middle; }
  </style>
  <rect width="1400" height="430" fill="#ffffff"/>
  <text x="54" y="60" class="title">Qwen3.5-9B：每 4 层中，3 层用 Gated DeltaNet，1 层用 Full Attention</text>
  <text x="54" y="94" class="sub">同一组结构重复 8 次，共 32 个 Decoder Layer。每层后面仍有 Dense FFN。</text>

  <g transform="translate(55 145)">
