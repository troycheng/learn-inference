<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3.8-Flash-Next Decoder 的完整数据流</title>
  <desc id="desc">左侧显示三层 Gated DeltaNet 加一层 QSA 的四层组合重复十二次，右侧显示每个 Decoder Layer 中 Token Mixer 和 MoE 分别通过 Gated Residual 读取和写回四条残差支路。</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
    .title { font-size: 34px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #64748b; }
    .panel-title { font-size: 22px; font-weight: 700; }
    .node-title { font-size: 18px; font-weight: 650; }
    .node-sub { font-size: 15px; fill: #64748b; }
    .small { font-size: 14px; fill: #64748b; }
    .arrow { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="60" y="68" class="title">48 层怎样组成一条完整 Decoder</text>
  <text x="60" y="104" class="subtitle">四条残差支路贯穿全部层；每个 Token Mixer 和 MoE 都先读支路，再把增量写回。</text>

  <rect x="60" y="150" width="390" height="670" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="90" y="194" class="panel-title">模型层排列</text>

  <rect x="110" y="230" width="290" height="66" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="255" y="258" text-anchor="middle" class="node-title">Token Embedding</text>
  <text x="255" y="282" text-anchor="middle" class="node-sub">[B,T,2560]</text>
  <path d="M255 296 V330" class="arrow"/>

  <rect x="110" y="330" width="290" height="72" rx="10" fill="#faf5ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="255" y="360" text-anchor="middle" class="node-title">复制成四条残差支路</text>
  <text x="255" y="385" text-anchor="middle" class="node-sub">[B,T,4,2560]</text>
  <path d="M255 402 V438" class="arrow"/>

  <rect x="92" y="438" width="326" height="296" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="115" y="473" class="node-title">四层为一组，重复 12 次</text>

  <rect x="120" y="500" width="270" height="42" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.8"/>
  <text x="255" y="527" text-anchor="middle" class="node-title">Gated DeltaNet</text>
  <rect x="120" y="554" width="270" height="42" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.8"/>
  <text x="255" y="581" text-anchor="middle" class="node-title">Gated DeltaNet</text>
  <rect x="120" y="608" width="270" height="42" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.8"/>
  <text x="255" y="635" text-anchor="middle" class="node-title">Gated DeltaNet</text>
  <rect x="120" y="662" width="270" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8"/>
  <text x="255" y="689" text-anchor="middle" class="node-title">QSA</text>
  <text x="255" y="770" text-anchor="middle" class="node-sub">36 个 GDN 层 + 12 个 QSA 层</text>

  <rect x="500" y="150" width="1040" height="670" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="535" y="194" class="panel-title">一个 Decoder Layer</text>
  <text x="535" y="224" class="node-sub">上排完成 Token Mixer，下排完成 MoE；两排使用不同的 GR 参数。</text>

  <rect x="550" y="280" width="180" height="90" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="640" y="315" text-anchor="middle" class="node-title">残差支路 R</text>
  <text x="640" y="344" text-anchor="middle" class="node-sub">[B,T,4,H]</text>
  <path d="M730 325 H790" class="arrow"/>

  <rect x="790" y="280" width="170" height="90" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="875" y="315" text-anchor="middle" class="node-title">GR Read</text>
  <text x="875" y="344" text-anchor="middle" class="node-sub">4H → H</text>
  <path d="M960 325 H1020" class="arrow"/>

  <rect x="1020" y="280" width="220" height="90" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text x="1130" y="315" text-anchor="middle" class="node-title">Token Mixer</text>
  <text x="1130" y="344" text-anchor="middle" class="node-sub">GDN 或 QSA</text>
  <path d="M1240 325 H1300" class="arrow"/>

  <rect x="1300" y="280" width="180" height="90" rx="12" fill="#faf5ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="1390" y="315" text-anchor="middle" class="node-title">GR Write</text>
  <text x="1390" y="344" text-anchor="middle" class="node-sub">H → 4 条增量</text>

  <path d="M1390 370 V440 H640 V475" class="arrow"/>

  <rect x="550" y="475" width="180" height="90" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="640" y="510" text-anchor="middle" class="node-title">更新后的 R</text>
  <text x="640" y="539" text-anchor="middle" class="node-sub">[B,T,4,H]</text>
  <path d="M730 520 H790" class="arrow"/>

  <rect x="790" y="475" width="170" height="90" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="875" y="510" text-anchor="middle" class="node-title">GR Read</text>
  <text x="875" y="539" text-anchor="middle" class="node-sub">4H → H</text>
  <path d="M960 520 H1020" class="arrow"/>

  <rect x="1020" y="475" width="220" height="90" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="1130" y="510" text-anchor="middle" class="node-title">MoE</text>
  <text x="1130" y="539" text-anchor="middle" class="node-sub">Top-10 + 共享专家</text>
  <path d="M1240 520 H1300" class="arrow"/>

  <rect x="1300" y="475" width="180" height="90" rx="12" fill="#faf5ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="1390" y="510" text-anchor="middle" class="node-title">GR Write</text>
  <text x="1390" y="539" text-anchor="middle" class="node-sub">H → 4 条增量</text>

  <path d="M1390 565 V635 H1135" class="arrow"/>
  <rect x="890" y="600" width="245" height="78" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="1012" y="632" text-anchor="middle" class="node-title">下一层的残差支路</text>
  <text x="1012" y="658" text-anchor="middle" class="node-sub">继续沿 48 层传递</text>

  <rect x="550" y="726" width="930" height="58" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1015" y="762" text-anchor="middle" class="node-sub">GR 扩展的是层间残差通道；Token Mixer 和 MoE 的输入输出宽度仍为 H。</text>
</svg>
