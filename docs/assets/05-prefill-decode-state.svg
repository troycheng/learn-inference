<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 610" width="1400" height="610">
  <defs>
    <marker id="b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/></marker>
  </defs>
  <style>
    text { font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif; fill:#111827; }
    .title { font-size:32px; font-weight:700; }
    .sub { font-size:17px; fill:#6b7280; }
    .h { font-size:21px; font-weight:700; text-anchor:middle; }
    .t { font-size:16px; text-anchor:middle; }
    .s { font-size:14px; fill:#6b7280; text-anchor:middle; }
  </style>
  <rect width="1400" height="610" fill="#ffffff"/>
  <text x="55" y="58" class="title">同一条递归规则，Prefill 和 Decode 使用不同执行路径</text>
  <text x="55" y="92" class="sub">Prefill 用 Chunk Kernel 组织已知序列；Decode 用单步 Kernel 原地更新固定状态。</text>

  <path d="M275 238 H370" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/>
  <path d="M610 238 H700" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
  <path d="M945 238 H1030" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/>
  <path d="M1270 238 H1290" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>

  <rect x="55" y="165" width="220" height="145" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="165" y="207" class="h">Prompt</text><text x="165" y="248" class="t">p1 p2 ... pT</text><text x="165" y="280" class="s">多个已知位置</text>
  <rect x="370" y="145" width="240" height="185" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="490" y="191" class="h">Chunk Kernel</text><text x="490" y="232" class="t">块内矩阵计算</text><text x="490" y="265" class="t">块间传递状态</text><text x="490" y="299" class="s">语义仍遵守递归顺序</text>
  <rect x="700" y="145" width="245" height="185" rx="15" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="822" y="190" class="h">Prefill 后状态</text><text x="822" y="235" class="t">conv_state</text><text x="822" y="268" class="t">recurrent_state</text><text x="822" y="301" class="s">shape 已固定</text>
  <rect x="1030" y="165" width="240" height="145" rx="15" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="1150" y="207" class="h">Decode：输入 y1</text><text x="1150" y="249" class="t">单步 Recurrent Kernel</text><text x="1150" y="281" class="s">只推进一个已确认位置</text>
  <rect x="1290" y="185" width="100" height="105" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="1340" y="225" class="h">更新</text><text x="1340" y="259" class="s">原 shape</text>

  <rect x="160" y="405" width="1080" height="105" rx="14" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="700" y="447" class="h">变化的是执行方法，不是状态更新的数学含义</text>
  <text x="700" y="484" class="t">后一个位置仍以之前的状态为起点；Chunk Kernel 只把已知序列组织得更适合硬件执行</text>

  <g transform="translate(55 565)">
    <line x1="0" y1="0" x2="38" y2="0" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/><text x="50" y="6" font-size="15" fill="#6b7280">当前输入</text>
    <line x1="185" y1="0" x2="223" y2="0" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/><text x="235" y="6" font-size="15" fill="#6b7280">状态传递</text>
  </g>
</svg>
