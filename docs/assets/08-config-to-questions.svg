<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-labelledby="title desc">
  <title id="title">从配置字段推导四类工程量</title>
  <desc id="desc">先把 config.json 中的层数、宽度、头数、Expert 数和数据格式还原为模块与 shape，再估算权重、计算量、请求状态与并行切分。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker></defs>
  <style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#6b7280}.h{font-size:18px;font-weight:700;text-anchor:middle}.t{font-size:15px;text-anchor:middle}.line{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#a)}</style>
  <rect width="1400" height="760" fill="#fff"/><text x="55" y="58" class="title">先把 config.json 还原成模块和 shape</text><text x="55" y="92" class="sub">同一组配置字段，可以继续推导权重、计算、请求状态和并行切分。</text>
  <rect x="55" y="280" width="250" height="150" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="180" y="322" class="h">配置字段</text><text x="180" y="360" class="t">H、L、Nq、Nkv、D</text><text x="180" y="392" class="t">I、E、K、dtype</text>
  <path d="M305 355 H420" class="line"/><rect x="420" y="280" width="260" height="150" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="550" y="322" class="h">模块与 shape</text><text x="550" y="360" class="t">Embedding、Token Mixer</text><text x="550" y="392" class="t">FFN、LM Head、Cache</text>
  <path d="M680 355 H785 V155 M785 155 V530" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M785 155 H870" class="line"/><path d="M785 280 H870" class="line"/><path d="M785 405 H870" class="line"/><path d="M785 530 H870" class="line"/>
  <rect x="870" y="110" width="440" height="90" rx="15" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="1090" y="145" class="h">权重与显存</text><text x="1090" y="176" class="t">参数量 × 保存字节数，Total 与 Active 分开</text>
  <rect x="870" y="235" width="440" height="90" rx="15" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="1090" y="270" class="h">计算量</text><text x="1090" y="301" class="t">Linear、QK/AV、状态更新与长度项</text>
  <rect x="870" y="360" width="440" height="90" rx="15" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="1090" y="395" class="h">请求状态</text><text x="1090" y="426" class="t">KV、卷积状态与递归状态</text>
  <rect x="870" y="485" width="440" height="90" rx="15" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="1090" y="520" class="h">并行切分</text><text x="1090" y="551" class="t">层、矩阵、请求与 Expert 的切分边界</text>
  <rect x="55" y="650" width="1255" height="55" rx="10" fill="#f8fafc"/><text x="683" y="685" class="sub" text-anchor="middle">先还原结构，再算数量级；模型名称不能代替 shape。</text>
</svg>
