<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 930" width="1400" height="930" role="img" aria-labelledby="title desc">
  <title id="title">从 Qwen3.5-9B 配置还原文本模型结构</title>
  <desc id="desc">左侧是 Qwen3.5-9B 的关键配置字段，右侧把数值还原成 Embedding 与 LM Head、三十二层混合层结构、Full Attention 头和 Dense SwiGLU 的实际 shape。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
    .title { font-size: 32px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #6b7280; }
    .panel-title { font-size: 19px; font-weight: 700; }
    .code { font-size: 16px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .code-light { fill: #bfdbfe; }
    .card-title { font-size: 18px; font-weight: 700; }
    .body { font-size: 15px; fill: #374151; }
    .body-light { fill: #cbd5e1; }
    .shape { font-size: 15px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .tag { font-size: 14px; font-weight: 700; text-anchor: middle; }
    .arrow { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
  </style>
  <rect width="1400" height="930" fill="#ffffff"/>
  <text x="52" y="55" class="title">一段 config.json 怎样还原成模型结构</text>
  <text x="52" y="85" class="subtitle">以 Qwen3.5-9B 的文本模型为例：字段值最终会落实到层数、头数和每张权重矩阵的 shape</text>

  <rect x="52" y="125" width="500" height="690" rx="18" fill="#0f172a"/>
  <text x="82" y="165" class="panel-title" fill="#ffffff">text_config 关键字段（layer_types 已缩写）</text>

  <rect x="78" y="195" width="448" height="74" rx="10" fill="#172554"/>
  <text x="98" y="225" class="code code-light">&quot;vocab_size&quot;: 248320,</text>
  <text x="98" y="253" class="code code-light">&quot;hidden_size&quot;: 4096,</text>

  <rect x="78" y="292" width="448" height="110" rx="10" fill="#172554"/>
  <text x="98" y="322" class="code code-light">&quot;num_hidden_layers&quot;: 32,</text>
  <text x="98" y="350" class="code code-light">&quot;full_attention_interval&quot;: 4,</text>
  <text x="98" y="375" class="code code-light">&quot;layer_types&quot;: [linear_attention×3,</text>
  <text x="245" y="397" class="code code-light">full_attention]×8</text>

  <rect x="78" y="417" width="448" height="132" rx="10" fill="#172554"/>
  <text x="98" y="447" class="code code-light">&quot;num_attention_heads&quot;: 16,</text>
  <text x="98" y="475" class="code code-light">&quot;num_key_value_heads&quot;: 4,</text>
  <text x="98" y="503" class="code code-light">&quot;head_dim&quot;: 256,</text>
  <text x="98" y="531" class="code code-light">GQA: 4 个 Query 头共享 1 组 K/V</text>

  <rect x="78" y="572" width="448" height="74" rx="10" fill="#172554"/>
  <text x="98" y="602" class="code code-light">&quot;intermediate_size&quot;: 12288,</text>
  <text x="98" y="630" class="code code-light">Dense SwiGLU FFN</text>

  <rect x="78" y="684" width="448" height="90" rx="10" fill="#111827" stroke="#475569"/>
  <text x="98" y="717" class="body body-light">这些字段来自同一个文本模型配置。</text>
  <text x="98" y="747" class="body body-light">不能只读“9B”这个模型名来代替它们。</text>

  <path d="M526 232 H605 V205 H650" class="arrow"/>
  <path d="M526 343 H605 V380 H650" class="arrow"/>
  <path d="M526 483 H605 V575 H650" class="arrow"/>
  <path d="M526 610 H605 V755 H650" class="arrow"/>

  <rect x="650" y="125" width="700" height="150" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="680" y="160" class="card-title">Embedding、层间接口和 LM Head</text>
  <text x="680" y="193" class="body">词表有 248320 个候选；每个 token 在语言模型中始终用 4096 个数表示。</text>
  <text x="680" y="228" class="shape">Embedding [248320,4096]　→　隐藏状态 [B,T,4096]</text>
  <text x="680" y="254" class="shape">LM Head [248320,4096]　→　Logits [B,T,248320]</text>

  <rect x="650" y="305" width="700" height="155" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="680" y="340" class="card-title">32 个 Decoder Layer 怎样排列</text>
  <rect x="680" y="365" width="125" height="42" rx="8" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="742" y="392" class="tag">GDN</text>
  <rect x="820" y="365" width="125" height="42" rx="8" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="882" y="392" class="tag">GDN</text>
  <rect x="960" y="365" width="125" height="42" rx="8" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="1022" y="392" class="tag">GDN</text>
  <rect x="1100" y="365" width="170" height="42" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="1185" y="392" class="tag">Full Attention</text>
  <text x="680" y="437" class="body">这组结构重复 8 次　→　24 层 Gated DeltaNet + 8 层 Full Attention</text>

  <rect x="650" y="490" width="700" height="200" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="680" y="525" class="card-title">一层 Full Attention 的 Q、K、V 头宽度</text>
  <text x="680" y="558" class="shape">Query：16 头 × 256 = 4096</text>
  <text x="680" y="590" class="shape">Key：   4 头 × 256 = 1024</text>
  <text x="680" y="622" class="shape">Value： 4 头 × 256 = 1024</text>
  <text x="680" y="650" class="body">Nq/Nkv=4：每 4 个 Query 头共享同一组 K/V，这就是 GQA。</text>
  <text x="680" y="673" class="body">Qwen3.5 的 q_proj 还额外输出 4096 维门控，本课 4.3 节单独计入。</text>

  <rect x="650" y="710" width="700" height="145" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="680" y="745" class="card-title">每层 Dense SwiGLU FFN</text>
  <text x="680" y="780" class="shape">gate_proj：[4096] → [12288]</text>
  <text x="980" y="780" class="shape">up_proj：[4096] → [12288]</text>
  <text x="680" y="815" class="shape">逐元素门控 [12288]　→　down_proj　→　[4096]</text>
  <text x="680" y="840" class="body">最后回到 4096 维，才能与残差分支逐元素相加并送入下一层。</text>

  <rect x="52" y="875" width="1298" height="38" rx="9" fill="#f1f5f9"/>
  <text x="701" y="901" class="body" text-anchor="middle">读配置的目标不是记字段名，而是能把字段还原成真实模块和 shape，再继续估算参数、计算量与请求状态。</text>
</svg>
