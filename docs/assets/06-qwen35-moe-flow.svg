<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3.5 MoE 层的完整计算流程</title>
  <desc id="desc">每个 token 先由 Router 选择 Routed Experts，同时经过 Shared Expert；Routed 与 Shared 两条 FFN 分支相加后恢复 Batch 和序列轴。</desc>
  <defs><marker id="b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker><marker id="o" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#ea580c"/></marker></defs>
  <style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#6b7280}.h{font-size:18px;font-weight:700;text-anchor:middle}.t{font-size:15px;text-anchor:middle}.s{font-size:13px;fill:#6b7280;text-anchor:middle}.blue{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#b)}.orange{fill:none;stroke:#ea580c;stroke-width:3;marker-end:url(#o)}</style>
  <rect width="1500" height="900" fill="#fff"/><text x="55" y="58" class="title">Qwen3.5-35B-A3B 一层 MoE 的数据流</text><text x="55" y="92" class="sub">256 个路由专家中每 token 选择 8 个；共享专家在 Top-8 之外固定执行。</text>
  <rect x="55" y="360" width="175" height="90" rx="13" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="143" y="397" class="h">Hidden States</text><text x="143" y="428" class="s">[B,T,2048]</text><path d="M230 405 H310" class="blue"/>
  <rect x="310" y="360" width="150" height="90" rx="13" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="385" y="397" class="h">展平</text><text x="385" y="428" class="s">[M,2048]</text>
  <path d="M460 390 H540 V235 H610" class="blue"/><path d="M460 420 H540 V650 H610" class="orange"/>
  <rect x="610" y="165" width="210" height="140" rx="15" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="715" y="202" class="h">Router</text><text x="715" y="235" class="t">Logits [M,256]</text><text x="715" y="267" class="t">Top-8 IDs / Weights</text><text x="715" y="291" class="s">两个 [M,8]</text>
  <path d="M820 235 H900" class="blue"/><rect x="900" y="145" width="250" height="180" rx="15" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="1025" y="185" class="h">按 Expert ID 分组</text><text x="1025" y="222" class="t">每 token 进入 8 个 Expert</text><text x="1025" y="255" class="t">各自 H → 512 → H</text><text x="1025" y="288" class="s">输出乘 Routing Weight</text>
  <path d="M1150 235 H1230" class="blue"/><rect x="1230" y="180" width="215" height="110" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="1338" y="221" class="h">按 token 汇总</text><text x="1338" y="255" class="s">Combine → [M,2048]</text>
  <rect x="610" y="570" width="250" height="160" rx="15" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="735" y="610" class="h">Shared Expert</text><text x="735" y="646" class="t">所有 token 执行</text><text x="735" y="678" class="t">H → 512 → H</text><text x="735" y="708" class="s">另算 Shared Gate [M,1]</text>
  <path d="M860 650 H1230 V510" class="orange"/><path d="M1338 290 V455" class="blue"/>
  <rect x="1230" y="455" width="215" height="110" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="1338" y="496" class="h">Routed + Shared</text><text x="1338" y="530" class="s">[M,2048]</text>
  <path d="M1338 565 V650" class="blue"/><rect x="1225" y="650" width="225" height="95" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="1338" y="688" class="h">还原 Batch 和序列轴</text><text x="1338" y="720" class="s">[B,T,2048]</text>
  <rect x="55" y="805" width="1390" height="50" rx="10" fill="#f8fafc"/><text x="750" y="837" class="sub" text-anchor="middle">M=B×T。MoE 只在内部临时按 Expert 分组，层的入口和出口仍保持 [B,T,H]。</text>
</svg>
