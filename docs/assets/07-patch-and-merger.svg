<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760">
  <defs><marker id="b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker><pattern id="grid" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M9 0H0V9" fill="none" stroke="#93c5fd" stroke-width="0.7"/></pattern></defs>
  <style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#6b7280}.h{font-size:19px;font-weight:700;text-anchor:middle}.t{font-size:15px;text-anchor:middle}.line{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#b)}</style>
  <rect width="1400" height="760" fill="#fff"/><text x="55" y="58" class="title">512×512 图片最终变成 256 条视觉向量</text><text x="55" y="92" class="sub">Patch 化先产生 1024 个位置，视觉编码后再由 2×2 Merger 合并。</text>
  <rect x="70" y="190" width="288" height="288" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><rect x="70" y="190" width="288" height="288" fill="url(#grid)"/><text x="214" y="525" class="h">512×512 RGB 图片</text><text x="214" y="555" class="t">32×32 Patch 网格</text>
  <path d="M358 335 H455" class="line"/><rect x="455" y="245" width="235" height="180" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="573" y="288" class="h">Patch Embedding</text><text x="573" y="327" class="t">每个 16×16 局部块</text><text x="573" y="362" class="t">投影为 [1152]</text><text x="573" y="398" class="h">1024 条向量</text>
  <path d="M690 335 H785" class="line"/><rect x="785" y="215" width="255" height="240" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="913" y="258" class="h">27 层视觉编码器</text><text x="913" y="300" class="t">Patch 间交换信息</text><text x="913" y="335" class="t">每个位置加工特征</text><text x="913" y="378" class="t">shape 仍是</text><text x="913" y="413" class="h">[1024,1152]</text>
  <path d="M1040 335 H1125" class="line"/><rect x="1125" y="235" width="220" height="200" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="1235" y="278" class="h">2×2 Merger</text><text x="1235" y="316" class="t">4×1152 → 4608</text><text x="1235" y="351" class="t">Linear → GELU → Linear</text><text x="1235" y="393" class="h">[256,H]</text>
  <rect x="455" y="590" width="890" height="75" rx="12" fill="#f8fafc"/><text x="900" y="620" class="h">位置数：1024 ÷ 4 = 256</text><text x="900" y="648" class="t">Merger 同时合并相邻特征，并把视觉宽度对齐到语言 Hidden Size。</text>
</svg>
