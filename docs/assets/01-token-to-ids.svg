<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Tokenizer 把文字变成 Token ID</title>
  <desc id="desc">文本先被切成 token，每个 token 再映射为词表中的整数编号。</desc>
  <style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827}.title{font-size:18px;font-weight:600}.label{font-size:14px;font-weight:600}.sub{font-size:12px;fill:#6b7280}.num{font-family:Menlo,Monaco,monospace;font-size:14px}</style>
  <defs><marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker></defs>
  <rect width="960" height="330" fill="#ffffff"/>
  <text x="40" y="42" class="title">Tokenizer 把“推理优化”切分并编号</text>
  <text x="40" y="67" class="sub">只展开用户内容。完整提示中的特殊 token 也会各自占据词表编号。</text>
  <rect x="48" y="132" width="176" height="72" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/><text x="136" y="161" text-anchor="middle" class="label">用户文字</text><text x="136" y="188" text-anchor="middle" class="num">推理优化</text>
  <path d="M244 168H344" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="294" y="151" text-anchor="middle" class="sub">切分</text>
  <rect x="366" y="132" width="126" height="72" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><rect x="510" y="132" width="126" height="72" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="429" y="161" text-anchor="middle" class="label">推理</text><text x="573" y="161" text-anchor="middle" class="label">优化</text><text x="429" y="188" text-anchor="middle" class="sub">第 1 个 token</text><text x="573" y="188" text-anchor="middle" class="sub">当前跟踪对象</text>
  <path d="M656 168H746" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="701" y="151" text-anchor="middle" class="sub">查询词表</text>
  <rect x="770" y="132" width="142" height="72" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="841" y="160" text-anchor="middle" class="num">111892, 99945</text><text x="841" y="188" text-anchor="middle" class="sub">Token IDs</text>
  <text x="40" y="284" class="sub">ID 的数值大小没有语义。99945 的作用是指向“优化”在词表和 Embedding 表中的位置。</text>
</svg>
