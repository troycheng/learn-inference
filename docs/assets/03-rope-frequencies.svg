<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" data-min-container-gutter="20">
  <title id="title">同一位置在不同二维组中采用不同的旋转角度</title>
  <desc id="desc">四维向量分成两个二维组。位置二时，第一组按每位置三十度累计旋转六十度，第二组按每位置三度累计旋转六度，最后重新拼成四维向量。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#2563EB"/>
    </marker>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .title { font-size: 31px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #64748B; }
      .heading { font-size: 20px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 600; }
      .note { font-size: 15px; fill: #64748B; }
      .input { fill: #EFF6FF; stroke: #2563EB; stroke-width: 2; }
      .fast { fill: #FFF7ED; stroke: #EA580C; stroke-width: 2; }
      .slow { fill: #FAF5FF; stroke: #7C3AED; stroke-width: 2; }
      .result { fill: #F0FDF4; stroke: #16A34A; stroke-width: 2; }
      .guide { fill: none; stroke: #CBD5E1; stroke-width: 2; }
      .baseline { fill: none; stroke: #94A3B8; stroke-width: 2; }
      .vector { fill: none; stroke: #2563EB; stroke-width: 4; marker-end: url(#arrow-blue); }
      .route { fill: none; stroke: #2563EB; stroke-width: 2.5; }
      .line { fill: none; stroke: #2563EB; stroke-width: 2.5; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#FFFFFF"/>
  <text x="54" y="58" class="title">同一个位置，两组特征转过的角度不同</text>
  <text x="54" y="92" class="subtitle">“旋转速度”指位置每增加 1，该二维组增加多少角度。下面的 30° 和 3° 只用于演示。</text>

  <!-- panel backgrounds -->
  <rect data-graph-role="container" x="70" y="260" width="500" height="270" rx="14" class="fast"/>
  <rect data-graph-role="container" x="630" y="260" width="500" height="270" rx="14" class="slow"/>

  <!-- connectors -->
  <path d="M600 210 V235 M300 235 H900" class="route"/>
  <path d="M300 235 V250" class="line"/>
  <path d="M900 235 V250" class="line"/>

  <!-- input vector -->
  <rect data-graph-role="node" data-node-id="q-input" x="430" y="120" width="340" height="90" rx="12" class="input"/>
  <text x="600" y="154" text-anchor="middle" class="heading">q = [ 1, 0  |  1, 0 ]</text>
  <text x="520" y="184" text-anchor="middle" class="note">第 1 组</text>
  <text x="680" y="184" text-anchor="middle" class="note">第 2 组</text>

  <!-- fast group -->
  <text x="100" y="300" class="heading">第 1 组：每个位置增加 30°</text>
  <circle cx="210" cy="405" r="68" class="guide"/>
  <line x1="210" y1="405" x2="274" y2="405" class="baseline"/>
  <path d="M210 405 L242 350" class="vector"/>
  <circle cx="210" cy="405" r="4" fill="#2563EB"/>
  <text x="210" y="494" text-anchor="middle" class="note">从 [1,0] 转到 60°</text>
  <text x="330" y="355" class="label">位置 m = 2</text>
  <text x="330" y="393" class="label">2 × 30° = 60°</text>
  <text x="330" y="432" class="note">[1,0] → [cos 60°, sin 60°]</text>
  <text x="330" y="466" class="label">≈ [0.500, 0.866]</text>

  <!-- slow group -->
  <text x="660" y="300" class="heading">第 2 组：每个位置增加 3°</text>
  <circle cx="770" cy="405" r="68" class="guide"/>
  <line x1="770" y1="405" x2="834" y2="405" class="baseline"/>
  <path d="M770 405 L833 398" class="vector"/>
  <circle cx="770" cy="405" r="4" fill="#2563EB"/>
  <text x="770" y="494" text-anchor="middle" class="note">从 [1,0] 转到 6°</text>
  <text x="890" y="355" class="label">位置 m = 2</text>
  <text x="890" y="393" class="label">2 × 3° = 6°</text>
  <text x="890" y="432" class="note">[1,0] → [cos 6°, sin 6°]</text>
  <text x="890" y="466" class="label">≈ [0.995, 0.105]</text>

  <!-- combined result -->
  <rect data-graph-role="node" data-node-id="q-output" x="140" y="570" width="920" height="74" rx="12" class="result"/>
  <text x="600" y="600" text-anchor="middle" class="heading">位置 2 的 q′ ≈ [ 0.500, 0.866  |  0.995, 0.105 ]</text>
  <text x="600" y="628" text-anchor="middle" class="note">位置编号都是 2；不同的是每组每前进一步所增加的角度。</text>
</svg>
