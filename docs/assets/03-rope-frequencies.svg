<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">RoPE 使用多种旋转速度</title>
  <desc id="desc">RoPE 把旋转维度分成多个二维特征组，不同组使用不同旋转速度。Qwen3.5 每个头 256 维，其中前 64 维参与旋转。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#2563EB"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0F172A; }
      .title { font-size: 32px; font-weight: 700; }
      .head { font-size: 22px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 600; }
      .note { font-size: 17px; fill: #475569; }
      .clock { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 3; }
      .hand { stroke: #2563EB; stroke-width: 5; marker-end: url(#arrow); }
      .tick { stroke: #94A3B8; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1200" height="610" fill="#FFFFFF"/>
  <text x="60" y="58" class="title">为什么不只用一种旋转速度</text>
  <text x="60" y="94" class="note">每个二维特征组都像一只表。位置增加相同步数，快表和慢表会转过不同角度。</text>

  <text x="215" y="153" text-anchor="middle" class="head">转得快</text>
  <g transform="translate(215 270)">
    <circle r="92" class="clock"/>
    <line x1="0" y1="-78" x2="0" y2="-92" class="tick"/><line x1="78" y1="0" x2="92" y2="0" class="tick"/><line x1="0" y1="78" x2="0" y2="92" class="tick"/><line x1="-78" y1="0" x2="-92" y2="0" class="tick"/>
    <line x1="0" y1="0" x2="-58" y2="-48" class="hand"/>
  </g>
  <text x="215" y="391" text-anchor="middle" class="note">少量位置变化</text>
  <text x="215" y="420" text-anchor="middle" class="note">角度就明显改变</text>

  <text x="510" y="153" text-anchor="middle" class="head">中等速度</text>
  <g transform="translate(510 270)">
    <circle r="92" class="clock"/>
    <line x1="0" y1="-78" x2="0" y2="-92" class="tick"/><line x1="78" y1="0" x2="92" y2="0" class="tick"/><line x1="0" y1="78" x2="0" y2="92" class="tick"/><line x1="-78" y1="0" x2="-92" y2="0" class="tick"/>
    <line x1="0" y1="0" x2="64" y2="-39" class="hand"/>
  </g>
  <text x="510" y="391" text-anchor="middle" class="note">同一个位置差</text>
  <text x="510" y="420" text-anchor="middle" class="note">形成另一种相位</text>

  <text x="805" y="153" text-anchor="middle" class="head">转得慢</text>
  <g transform="translate(805 270)">
    <circle r="92" class="clock"/>
    <line x1="0" y1="-78" x2="0" y2="-92" class="tick"/><line x1="78" y1="0" x2="92" y2="0" class="tick"/><line x1="0" y1="78" x2="0" y2="92" class="tick"/><line x1="-78" y1="0" x2="-92" y2="0" class="tick"/>
    <line x1="0" y1="0" x2="15" y2="-74" class="hand"/>
  </g>
  <text x="805" y="391" text-anchor="middle" class="note">变化更缓慢</text>
  <text x="805" y="420" text-anchor="middle" class="note">保留更长尺度的差别</text>

  <rect x="965" y="145" width="185" height="290" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="1058" y="184" text-anchor="middle" class="head">一起使用</text>
  <text x="1058" y="226" text-anchor="middle" class="note">一只表会周期重合</text>
  <text x="1058" y="258" text-anchor="middle" class="note">多种速度共同提供</text>
  <text x="1058" y="290" text-anchor="middle" class="note">更丰富的距离特征</text>
  <text x="1058" y="342" text-anchor="middle" class="note">模型再结合内容</text>
  <text x="1058" y="374" text-anchor="middle" class="note">学习怎样使用它们</text>

  <text x="60" y="493" class="head">Qwen3.5-9B 的一个 Full Attention 头</text>
  <rect x="60" y="520" width="1080" height="52" rx="10" fill="#E2E8F0"/>
  <rect x="60" y="520" width="270" height="52" rx="10" fill="#BFDBFE"/>
  <path d="M320 520H340V572H320" fill="#BFDBFE"/>
  <text x="195" y="553" text-anchor="middle" class="label">前 64 维：RoPE</text>
  <text x="735" y="553" text-anchor="middle" class="label">后 192 维：原样通过</text>
  <text x="1140" y="553" text-anchor="end" class="note">共 256 维</text>
</svg>
