<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">缩放点积 Attention 的主计算</title>
  <desc id="desc">同一组隐藏状态分别产生查询、键和值，查询和键计算分数，经过因果遮罩和 Softmax 后得到权重。每头汇总值后得到 [B,T,D]，所有查询头拼接并经过输出投影后才得到完整子层输出 [B,T,H]。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0F172A; }
      .title { font-size: 30px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 650; }
      .small { font-size: 17px; fill: #475569; }
      .box { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 2; rx: 12; }
      .blue { fill: #EFF6FF; stroke: #2563EB; }
      .green { fill: #F0FDF4; stroke: #16A34A; }
      .orange { fill: #FFF7ED; stroke: #EA580C; }
      .line { fill: none; stroke: #64748B; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="650" fill="#FFFFFF"/>
  <text x="60" y="62" class="title">缩放点积 Attention 的主计算</text>
  <text x="60" y="96" class="small">先判断应该关注哪些位置，再按权重取回这些位置携带的信息</text>

  <rect x="55" y="255" width="180" height="90" class="box blue"/>
  <text x="145" y="292" text-anchor="middle" class="label">隐藏状态 X</text>
  <text x="145" y="322" text-anchor="middle" class="small">[B,T,H]</text>

  <rect x="315" y="130" width="170" height="72" class="box blue"/>
  <text x="400" y="174" text-anchor="middle" class="label">查询 Q</text>
  <rect x="315" y="264" width="170" height="72" class="box blue"/>
  <text x="400" y="308" text-anchor="middle" class="label">键 K</text>
  <rect x="315" y="398" width="170" height="72" class="box blue"/>
  <text x="400" y="442" text-anchor="middle" class="label">值 V</text>

  <path d="M235 285 C270 285 270 166 315 166" class="line"/>
  <path d="M235 300 L315 300" class="line"/>
  <path d="M235 315 C270 315 270 434 315 434" class="line"/>
  <text x="260" y="245" class="small">3 组不同的 Linear</text>

  <rect x="570" y="187" width="190" height="90" class="box orange"/>
  <text x="665" y="225" text-anchor="middle" class="label">Q 与 K 点积</text>
  <text x="665" y="255" text-anchor="middle" class="small">相关性分数</text>
  <path d="M485 166 C530 166 530 215 570 215" class="line"/>
  <path d="M485 300 C530 300 530 249 570 249" class="line"/>

  <rect x="830" y="125" width="190" height="72" class="box orange"/>
  <text x="925" y="169" text-anchor="middle" class="label">因果遮罩</text>
  <rect x="830" y="234" width="190" height="72" class="box orange"/>
  <text x="925" y="278" text-anchor="middle" class="label">Softmax</text>
  <path d="M760 232 C795 232 795 161 830 161" class="line"/>
  <path d="M925 197 L925 234" class="line"/>

  <rect x="830" y="365" width="190" height="90" class="box green"/>
  <text x="925" y="403" text-anchor="middle" class="label">加权汇总 V</text>
  <text x="925" y="433" text-anchor="middle" class="small">单头输出 [B,T,D]</text>
  <path d="M925 306 L925 365" class="line"/>
  <path d="M485 434 C650 434 680 410 830 410" class="line"/>

  <rect x="1035" y="352" width="125" height="116" class="box green"/>
  <text x="1097" y="388" text-anchor="middle" class="small">拼接 + o_proj</text>
  <text x="1097" y="423" text-anchor="middle" class="label">完整输出</text>
  <text x="1097" y="453" text-anchor="middle" class="small">[B,T,H]</text>
  <path d="M1020 410 L1035 410" class="line"/>

  <rect x="55" y="545" width="1105" height="58" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="607" y="581" text-anchor="middle" class="small">Q、K 决定“看哪里”；V 汇总后是单头 [B,T,D]；拼接各查询头并经 o_proj 后才回到 [B,T,H]。</text>
</svg>
