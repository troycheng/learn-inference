<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="title desc">
  <title id="title">因果卷积只读取当前位置和左侧窗口</title>
  <desc id="desc">计算位置 p3 时，宽度为 3 的卷积读取 p1、p2、p3，不读取未来位置 p4。输入二、五、一分别乘以零点二、零点三、零点五，得到二点四。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #64748b; }
    .heading { font-size: 18px; font-weight: 700; }
    .label { font-size: 16px; font-weight: 600; text-anchor: middle; }
    .value { font-size: 22px; font-weight: 700; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .note { font-size: 15px; fill: #475569; }
    .formula { font-size: 20px; font-weight: 700; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="52" y="56" class="title">因果卷积：当前位置只能读取左侧窗口</text>
  <text x="52" y="86" class="subtitle">只看一个通道。计算 p3 时，窗口宽度为 3，因此输入是 p1、p2、p3；p4 仍属于未来。</text>

  <text x="70" y="142" class="heading">这个通道上的输入</text>
  <g data-graph-role="node" id="p1">
    <rect x="70" y="170" width="180" height="92" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="160" y="200" class="label">p1</text>
    <text x="160" y="239" class="value">2</text>
  </g>
  <g data-graph-role="node" id="p2">
    <rect x="270" y="170" width="180" height="92" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="360" y="200" class="label">p2</text>
    <text x="360" y="239" class="value">5</text>
  </g>
  <g data-graph-role="node" id="p3">
    <rect x="470" y="164" width="180" height="104" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="560" y="198" class="label">p3，当前</text>
    <text x="560" y="241" class="value">1</text>
  </g>
  <g data-graph-role="node" id="p4">
    <rect x="670" y="170" width="180" height="92" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="760" y="200" class="label" fill="#64748b">p4，未来</text>
    <text x="760" y="239" class="value" fill="#94a3b8">4</text>
    <line x1="705" y1="188" x2="815" y2="248" stroke="#ef4444" stroke-width="4"/>
    <line x1="815" y1="188" x2="705" y2="248" stroke="#ef4444" stroke-width="4"/>
  </g>

  <text x="70" y="310" class="heading">窗口中的三项分别乘以卷积权重</text>
  <g>
    <rect x="90" y="332" width="140" height="58" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="160" y="368" class="formula">2 × 0.2</text>
    <rect x="290" y="332" width="140" height="58" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="360" y="368" class="formula">5 × 0.3</text>
    <rect x="490" y="332" width="140" height="58" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="560" y="368" class="formula">1 × 0.5</text>
  </g>

  <g data-graph-role="edge" data-source="p1" data-target="sum">
    <path d="M160 392 V432 H850" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  </g>
  <g data-graph-role="edge" data-source="p2" data-target="sum">
    <path d="M360 392 V420 H850" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  </g>
  <g data-graph-role="edge" data-source="p3" data-target="sum">
    <path d="M560 392 V408 H850" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  </g>

  <g data-graph-role="node" id="sum">
    <rect x="875" y="330" width="260" height="122" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="1005" y="365" class="label">p3 的卷积输出</text>
    <text x="1005" y="408" class="formula">0.4 + 1.5 + 0.5</text>
    <text x="1005" y="439" class="value">= 2.4</text>
  </g>

  <rect x="70" y="488" width="1065" height="48" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="94" y="518" class="note">Depthwise 表示每个通道各自做这次沿 token 轴的卷积；不同通道不会在这一步相加。</text>
</svg>
