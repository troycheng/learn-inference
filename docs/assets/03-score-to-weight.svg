<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-labelledby="title desc">
  <title id="title">一行 Attention 分数经过 Softmax 变成权重</title>
  <desc id="desc">位置 3 对三个位置的分数是 0.707、1.414、0.707。图中给出 Softmax 公式，并以位置 2 为例计算得到权重 0.503。</desc>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
    .title { font-size: 34px; font-weight: 600; }
    .subtitle { font-size: 18px; fill: #6b7280; }
    .label { font-size: 21px; font-weight: 600; }
    .body { font-size: 19px; }
    .small { font-size: 16px; fill: #6b7280; }
    .number { font-size: 23px; font-weight: 600; }
    .formula { font-size: 22px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1200" height="590" fill="#ffffff"/>
  <text class="title" x="54" y="62">Softmax 怎样把一行分数变成权重</text>
  <text class="subtitle" x="54" y="96">继续计算位置 3 的“它”。它位于最后，所以这一行没有未来位置需要遮挡。</text>

  <!-- arrows sit in the clear gaps between the three cards -->
  <path d="M384 305 H425" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M775 305 H816" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- input scores -->
  <rect data-graph-role="node" data-node-id="scores" x="54" y="170" width="330" height="270" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text class="label" x="219" y="211" text-anchor="middle">缩放后的分数 s</text>
  <text class="small" x="219" y="241" text-anchor="middle">数值可正可负，总和没有固定要求</text>
  <text class="body" x="86" y="300">位置 1：“小明”</text>
  <text class="number" x="350" y="300" text-anchor="end">0.707</text>
  <text class="body" x="86" y="350">位置 2：“杯子”</text>
  <text class="number" x="350" y="350" text-anchor="end">1.414</text>
  <text class="body" x="86" y="400">位置 3：“它”</text>
  <text class="number" x="350" y="400" text-anchor="end">0.707</text>

  <!-- formula and one worked weight -->
  <rect data-graph-role="node" data-node-id="softmax" x="425" y="150" width="350" height="310" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="label" x="600" y="190" text-anchor="middle">Softmax</text>
  <text class="formula" x="600" y="232" text-anchor="middle">wᵢ = exp(sᵢ) / Σⱼ exp(sⱼ)</text>
  <text class="small" x="600" y="260" text-anchor="middle">exp(x) 就是 eˣ</text>
  <line x1="459" y1="280" x2="741" y2="280" stroke="#bfdbfe" stroke-width="1.5"/>
  <text class="small" x="600" y="310" text-anchor="middle">本例先算三项共同的分母</text>
  <text class="body" x="600" y="342" text-anchor="middle">Z = 2 × exp(0.707)</text>
  <text class="body" x="600" y="370" text-anchor="middle">+ exp(1.414)</text>
  <text class="body" x="600" y="410" text-anchor="middle">w₂ = exp(1.414) / Z ≈ 0.503</text>
  <text class="small" x="600" y="438" text-anchor="middle">另外两项用同一个 Z</text>

  <!-- output weights -->
  <rect data-graph-role="node" data-node-id="weights" x="816" y="170" width="330" height="270" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text class="label" x="981" y="211" text-anchor="middle">用于汇总 V 的权重 w</text>
  <text class="small" x="981" y="241" text-anchor="middle">都不小于 0，并且总和为 1</text>
  <text class="body" x="848" y="300">位置 1：“小明”</text>
  <text class="number" x="1112" y="300" text-anchor="end">0.248</text>
  <text class="body" x="848" y="350">位置 2：“杯子”</text>
  <text class="number" x="1112" y="350" text-anchor="end">0.503</text>
  <text class="body" x="848" y="400">位置 3：“它”</text>
  <text class="number" x="1112" y="400" text-anchor="end">0.248</text>

  <rect x="168" y="500" width="864" height="58" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text class="body" x="600" y="536" text-anchor="middle">每一项都除以同一个 Z：分数越大，权重越大；所有权重之和为 1。</text>
</svg>
